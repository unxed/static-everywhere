# onebin-linux-universal-meson.ini — Profile U for Meson dependencies.
# Keep every dependency static and target musl. Runtime host libraries are
# not linked here; SoLo is attached to the far2l executable by the CMake
# toolchain after this dependency prefix has been produced.

[binaries]
c = ['zig-cc']
cpp = ['zig-c++']
ar = 'zig-ar'
ranlib = 'zig-ranlib'
strip = 'strip'

[built-in options]
c_args = ['-target', 'x86_64-linux-musl', '-fstack-protector-strong']
cpp_args = ['-target', 'x86_64-linux-musl', '-fstack-protector-strong']
c_link_args = ['-target', 'x86_64-linux-musl', '-static', '-static-libgcc', '-Wl,--gc-sections', '-Wl,-z,relro', '-Wl,-z,now', '-Wl,-z,noexecstack', '-pie', '-s']
cpp_link_args = ['-target', 'x86_64-linux-musl', '-static', '-static-libgcc', '-static-libstdc++', '-Wl,--gc-sections', '-Wl,-z,relro', '-Wl,-z,now', '-Wl,-z,noexecstack', '-pie', '-s']
default_library = 'static'
