# onebin-linux-hybrid-meson.ini — Profile H for Meson-based projects
# (fontconfig, SDL2, ...): dynamic against a pinned glibc baseline,
# static C/C++ runtime. Mirrors onebin-linux-hybrid.cmake's flags
# exactly — DESIGN-onebin.md §8. Use as a *native* file, not a cross
# file: this project never changes CPU architecture or OS, only which
# compiler and flags produce the binary, so meson's cross-compilation
# machinery (which disables running compiled test binaries, forces
# "cross" library search rules, etc.) is not what we want here — same
# reasoning as onebin-linux-hybrid.cmake not setting CMAKE_SYSTEM_NAME
# to anything but plain "Linux".
#
#   PATH="$(pwd)/onebin/toolchain:$PATH" \
#     meson setup build --native-file onebin/toolchain/onebin-linux-hybrid-meson.ini ...
#
# Requires `zig` AND this directory's zig-cc/zig-c++/zig-ar/zig-ranlib
# wrapper scripts on PATH. Unlike onebin-linux-hybrid.cmake, a Meson
# native file has no built-in mechanism to reference paths relative to
# the file itself (CMake's toolchain file uses
# get_filename_component(... "${CMAKE_CURRENT_LIST_FILE}" DIRECTORY)
# for exactly this reason), so the [binaries] entries below are bare
# names resolved via PATH rather than absolute paths — the caller must
# put onebin/toolchain on PATH first, as shown above.

[binaries]
c = ['zig-cc']
cpp = ['zig-c++']
ar = 'zig-ar'
ranlib = 'zig-ranlib'
strip = 'strip'

[built-in options]
# Kept in sync by hand with onebin-linux-hybrid.cmake's
# CMAKE_C_FLAGS_INIT/CMAKE_CXX_FLAGS_INIT. -ffile-prefix-map is
# deliberately omitted here (unlike the CMake file): it needs the
# project's own source/build directory, which a shared native file
# can't know in advance, and -s below already reaches the OB0060 paths
# that matter in practice (see onebin-linux-hybrid.cmake's comment on
# why -s, not -ffile-prefix-map, is what actually clears zig's own
# bundled-CRT debug-path warnings). A project that wants
# -ffile-prefix-map too can still add it via `meson setup -Dc_args=...`
# on top of this file.
c_args = ['-target', 'x86_64-linux-gnu.2.28', '-fstack-protector-strong', '-isystem', '/usr/include']
cpp_args = ['-target', 'x86_64-linux-gnu.2.28', '-fstack-protector-strong', '-isystem', '/usr/include']

# Same rationale as the CMake file's _onebin_link_flags: static
# C/C++ runtime, PIE + full RELRO + strip, and explicit -L for the
# host's normal system library directories because `zig cc -target`
# does not search them by default even when the target otherwise
# matches the host exactly.
#
# -target is REQUIRED here too, not just in c_args/cpp_args above: found
# building fontconfig, the hard way. Meson runs the final link as a
# separate invocation of the compiler-as-linker-driver using ONLY
# c_link_args/cpp_link_args, not c_args/cpp_args -- unlike CMake, which
# folds CMAKE_C_FLAGS_INIT into the link command too, which is why
# onebin-linux-hybrid.cmake never hit this. Without -target here, zig's
# bundled Clang driver falls back to the *native host* target for
# link-time decisions (sysroot, default crt/libc search, multiarch
# triple) even though every object file was compiled for the pinned
# baseline -- so the executable's SONAMEs still look right
# (libc.so.6/libm.so.6), but individual undefined symbols silently bind
# against the HOST's newest available versioned symbol instead of the
# pinned baseline's. Confirmed concretely: a harfbuzz-only smoketest
# linked with -target present bound hypotf at GLIBC_2.2.5; fontconfig's
# fc-match, linked without -target on the link step, bound the exact
# same object's hypotf reference at GLIBC_2.35 -- same .o, same
# relocation, different result purely from -target's absence at link
# time. Re-adding -target x86_64-linux-gnu.2.28 to c_link_args/
# cpp_link_args fixed it: confirmed via `objdump -T | grep GLIBC_` that
# every versioned symbol in the resulting binary now tops out at 2.28.
c_link_args = ['-target', 'x86_64-linux-gnu.2.28', '-static-libgcc', '-Wl,--gc-sections', '-Wl,-z,relro', '-Wl,-z,now', '-Wl,-z,noexecstack', '-pie', '-s', '-L/usr/lib/x86_64-linux-gnu', '-L/usr/lib', '-L/lib/x86_64-linux-gnu']
cpp_link_args = ['-target', 'x86_64-linux-gnu.2.28', '-static-libgcc', '-static-libstdc++', '-Wl,--gc-sections', '-Wl,-z,relro', '-Wl,-z,now', '-Wl,-z,noexecstack', '-pie', '-s', '-L/usr/lib/x86_64-linux-gnu', '-L/usr/lib', '-L/lib/x86_64-linux-gnu']

default_library = 'static'
