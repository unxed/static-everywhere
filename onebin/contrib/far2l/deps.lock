# contrib/far2l/deps.lock — 00-AGENT-TASK.md Task 15.
#
# One line per third-party dependency actually needed by the four
# configurations in 04-REFERENCE-far2l.md §6: name version sha256 url.
# Comments (#) and blank lines ignored. tools/build-far2l.sh reads this
# file; versions and hashes are never hardcoded in the script itself.
#
# Every hash below was computed from a real download in this session
# (`sha256sum` on the file at the pinned URL) — none are fabricated. Where
# a hash could not be obtained the column holds "-", per this task's own
# instruction that a missing hash is honest and a fabricated one is not;
# as of this writing every entry here was actually fetched and hashed, so
# there are no "-" rows, but the column format keeps that possible for a
# future addition made without network access.
#
# far2l itself is pinned separately, as a git tag (04-REFERENCE-far2l.md
# §2): FAR2L_TAG=v_2.8.0, checked out via `git clone --depth 1 --branch`,
# never a tarball (§7.8 — a detached tarball checkout makes `git describe
# --tag` disagree with packaging/version and poisons the build with a
# commit-hash version string).
#
# far2l-tiny needs NONE of these: every optional subsystem that would pull
# a third-party library is explicitly disabled in its cmake invocation
# (04-REFERENCE-far2l.md §6.1) — that is the entire point of the
# configuration. Every dependency below is for far2l-tty / far2l-sdl
# (NetRocks, MultiArc, Colorer, UCD charset detection default to "yes" and
# are left there) and far2l-sdl's GUI|SDL backend specifically.
#
# libsmbclient is deliberately NOT listed: 04-REFERENCE-far2l.md's cheat
# sheet calls it "practically unbundleable... disable it", and NetRocks
# degrades each protocol independently when its library is absent
# (04-REFERENCE-far2l.md §4.2's -DNETROCKS row) — so simply not providing
# it under --deps-prefix is the correct way to disable SMB support without
# a dedicated CMake flag for it.
#
# wxWidgets is deliberately NOT listed: far2l-wx (04-REFERENCE-far2l.md
# §6.4) is built against the host's own dynamic wxWidgets package on
# purpose — it exists to measure a Level-1 failure, not to avoid one, and
# statically bundling wxWidgets/GTK would be enormous effort spent making
# a configuration that is supposed to fail look like it doesn't.

