# fontconfig: reads the HOST's real font config/cache (Layer 2),
# static against this file's own freetype+harfbuzz and expat. Built
# via Meson (onebin-linux-hybrid-meson.ini). Verified: fc-match,
# fc-cache, fc-list, fc-query and fc-cat all pass `onebin audit
# --profile hybrid --level 1 --strict` with 0 findings (`needed:
# libc.so.6 libm.so.6 libpthread.so.0`, GLIBC_2.28 -- exactly the
# baseline, nothing newer). fc-match run against the real host's
# /etc/fonts + /usr/share/fonts correctly resolved "DejaVu Serif" and
# "monospace" to real installed font files.
#
# Three real findings along the way, all fixed:
#
# 1. FreeType's installed .pc file declares a *public* (non-private)
#    "Requires: zlib", so any pkg-config consumer of freetype2 -- like
#    fontconfig via Meson -- also resolves "zlib" via pkg-config. This
#    project's own zlib build never generated a zlib.pc, so pkg-config
#    silently fell back to the HOST's system zlib.pc, linking the
#    host's dynamic libz.so.1 (GLIBC_2.35) into an otherwise-clean
#    Profile H binary. Fixed by installing a zlib.pc for this
#    project's own static zlib build and pointing PKG_CONFIG_PATH at
#    it ahead of the system one -- still needs folding into the zlib
#    step for real once tools/build-far2l.sh exists.
#
# 2. fontconfig bakes its configured --sysconfdir/--datadir/cache-dir
#    into the binary at *compile* time (it has no runtime env-var
#    override for these), so building it with our own sandbox
#    --prefix baked its OWN /home/.../install-p2/etc/fonts in as the
#    config path instead of the HOST's real /etc/fonts -- a direct
#    violation of this project's own Layer 2 doctrine ("fontconfig
#    reads the host's fonts", 04-REFERENCE-far2l.md §3.5/§7.7,
#    already flagged once for FreeType). Fixed by configuring with
#    --sysconfdir=/etc --datadir=/usr/share
#    -Dcache-dir=/var/cache/fontconfig explicitly, independent of
#    --prefix, so the built library reads the *host's* real fontconfig
#    config/cache/font directories at runtime, exactly as intended.
#
# 3. THE REAL BUG, and the one that actually caused the GLIBC_2.35
#    finding first reported here (item 1 above was a real, separate
#    bug, but fixing it alone did not fix the GLIBC_2.35 symptom --
#    that's what made this one so confusing to isolate): Meson runs
#    the final link step as a SEPARATE compiler-as-linker-driver
#    invocation using only c_link_args/cpp_link_args, never
#    c_args/cpp_args -- unlike CMake, which folds CMAKE_C_FLAGS_INIT
#    into the link command too (why onebin-linux-hybrid.cmake never
#    hit this). onebin-linux-hybrid-meson.ini had `-target
#    x86_64-linux-gnu.2.28` only in c_args/cpp_args, not in
#    c_link_args/cpp_link_args. Without -target at link time, zig's
#    bundled Clang driver falls back to the *native host* target for
#    link-time decisions (sysroot, default crt/libc search, multiarch
#    triple), even though every object file was compiled correctly for
#    the pinned baseline -- so NEEDED SONAMEs still looked right
#    (libc.so.6/libm.so.6), but individual undefined symbols (hypotf,
#    from libharfbuzz.a, in this case) silently bound against the
#    HOST's newest available versioned symbol instead of the pinned
#    baseline's. Confirmed with a controlled A/B: the exact same
#    libharfbuzz.a object, linked with -target present, binds hypotf at
#    GLIBC_2.2.5; linked without it, GLIBC_2.35 -- same relocation,
#    different linker behaviour purely from -target's absence. Fixed by
#    adding -target x86_64-linux-gnu.2.28 to
#    c_link_args/cpp_link_args too. This also happened to fix the
#    unexplained Meson build-tree RUNPATH auto-injection
#    (/usr/lib/etc into DT_RUNPATH with no explicit -rpath flag
#    anywhere) noted in an earlier version of this comment -- the
#    rebuilt binaries carry no RPATH/RUNPATH at all, so whatever
#    triggered that was tied to the same missing-target link
#    invocation. `patchelf --remove-rpath` is no longer needed.
#
# Any other Meson-based dependency in this file (SDL2, next) MUST use
# the corrected onebin-linux-hybrid-meson.ini -- if hypotf-style
# findings show up again with a `requires GLIBC_x.y` newer than the
# baseline, check c_link_args/cpp_link_args for -target first.
#
# DANGER, confirmed twice: fontconfig's own Meson custom install script
# (conf.d/link_confs.py) does NOT respect DESTDIR. `DESTDIR=$STAGING
# meson install` still writes directly into the REAL, absolute
# /etc/fonts/conf.d and overwrites /etc/fonts/fonts.conf on the actual
# build host -- confirmed by diffing against the untouched .deb both
# times it happened. Do not run `meson install` for this dependency at
# all. Copy libfontconfig.a, the generated fontconfig.pc, and the
# fontconfig/ header directory out of the build tree by hand instead.
fontconfig 2.18.3 9ae01e1d53acdef56010c5451cd34aa41d325b2faccd8606448d8fa01b2496b3 https://gitlab.freedesktop.org/fontconfig/fontconfig/-/archive/2.18.3/fontconfig-2.18.3.tar.gz

# SDL2: the graphics group's last library -- "the point of the exercise"
# per the top-level README. Built via CMake (SDL2 has its own upstream
# CMakeLists.txt, not Meson), onebin-linux-hybrid.cmake,
# -DSDL_STATIC=ON -DSDL_SHARED=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
# (needed because far2l_sdl.so is a dlopen'd module -- 04-REFERENCE-far2l.md
# §3.2 -- so the static SDL2 archive linked into it must be PIC). Every
# windowing/GPU/audio backend left at its upstream default: SDL_X11=ON
# SDL_X11_SHARED=ON, SDL_WAYLAND=ON SDL_WAYLAND_SHARED=ON,
# SDL_ALSA/SDL_PULSEAUDIO=ON (both dlopen'd), SDL_LIBUDEV=ON,
# SDL_DBUS=ON, SDL_IBUS=ON -- SDL dlopens every one of these itself, by
# design, matching this project's own Profile H doctrine exactly (Layer
# 3: "protocol first, dlopen only where physics demands it"). Nothing
# in deps.lock or the build recipe was needed to make that happen; it's
# how SDL2 already ships.
#
# Verified for real: a smoketest (not just a link check) calls
# SDL_Init(SDL_INIT_VIDEO), lists every compiled-in video driver
# (x11, wayland, offscreen, dummy, evdev — confirms the dlopen surface
# actually got compiled in, not silently dropped), creates a window via
# the `dummy` driver (SDL_VIDEODRIVER=dummy — no real display in the
# build sandbox), fills its surface, and updates it — Layer 3 exercised,
# not just Layer 1 code compiling. `needed: libc.so.6 libdl.so.2
# libm.so.6 libpthread.so.0` — inside the Profile H six-soname
# allowlist, nothing else linked in. `onebin audit --profile hybrid
# --level 1 --strict`: PASS, 0 errors, 0 warnings.
#
# One real finding, fixed in onebin itself, not just documented:
# `onebin`'s own host-contract soname list (01-SPEC-audit.md §7.7,
# `onebin/src/audit/checks/c_host.c`) only ever covered GPU/audio
# sonames (the doctrine's originally-stated scope). The very first real
# audit of an SDL2-linked binary reported 15 OB0071 warnings ("appears
# to dlopen a library outside the host contract") for exactly the
# windowing/desktop-integration sonames SDL dlopens by design: libX11,
# libX11-xcb, libXext, libXcursor, libXfixes, libXrandr, libXss, libXi,
# libwayland-client/cursor/egl, libxkbcommon, libdbus-1, and
# libGLES_CM/libGLESv1_CM (OpenGL ES 1.x Common Profile — distinct
# strings from the already-listed libGLESv2.so, an ES1 fallback SDL
# also dlopens). This was a real gap, not a false positive: a
# `dlopen`-only windowing backend is exactly the Layer 3 pattern this
# project's own doctrine describes, but the linter didn't recognize it
# yet because no reference build had needed it before now. Fixed by
# extending `KNOWN_HOST_LIBS` in `c_host.c` and the matching list in
# `01-SPEC-audit.md` §7.7, with two new tests
# (`host_libX11_known`/`host_libwayland_client_known`/
# `host_libGLES_CM_known`) in `tests/t_checks_host.c`. `make test`:
# 268 passed, 0 failed, 3 skipped (was 259). `make coverage`: gate
# still passes (90.89% line / 95.28% branch, unchanged). This is
# exactly the "reference application dictates the linter" dynamic the
# top-level README already documents happening twice before far2l's
# TTYX broker and Profile M — SDL2 is the third instance.
sdl2 2.32.10 5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165 https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz

