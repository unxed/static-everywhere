# contrib/far2l/deps.lock — pinned static third-party library sources for
# the far2l reference build. Read by tools/build-far2l.sh (§10 of
# 04-REFERENCE-far2l.md); never hardcoded in the script and never "latest".
#
# Format: one dependency per line, four whitespace-separated fields:
#   name  version  sha256  url
#
# - `name` is the deps.lock key tools/build-far2l.sh looks up, not
#   necessarily the upstream project name (e.g. multiple libs may share a
#   vendor).
# - `version` is the upstream release version string, exactly as upstream
#   names its tag/tarball.
# - `sha256` is the checksum of the exact tarball at `url`, computed and
#   verified locally before this line was added — never copied from a
#   webpage's stated hash without also downloading and hashing the file.
# - `url` must point at an immutable release asset (a versioned release
#   tarball or a tag archive), never a branch or a "latest" redirect.
#
# Comment lines (`#`) and blank lines are ignored. Do not reorder entries
# without a reason; the order below is dependency order, roughly matching
# 04-REFERENCE-far2l.md §5's table, grouped by which far2l feature area
# pulls each one in (archives / network / graphics). Update STATUS.md's
# task table when a group is completed.

# --- archives (MULTIARC) -----------------------------------------------
# zlib is the common base of nearly everything below it in this file
# (libarchive's deflate support, OpenSSL, libssh's compression, FreeType's
# PNG-embedded-font paths) as well as of MULTIARC directly, so it is
# pinned first regardless of group. Verified: builds clean as a static
# .a with onebin-linux-hybrid.cmake (zig 0.13.0, x86_64-linux-gnu.2.28),
# and a smoketest program linked against it passes
# `onebin audit --profile hybrid --level 1 --strict` with 0 findings.
zlib 1.3.2 bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16 https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz

# bzip2 has no CMakeLists.txt of its own (plain Makefile only) and its
# library sources have no external dependencies, so no CMake toolchain
# integration was needed to prove this one — the 7 library .c files
# (blocksort/huffman/crctable/randtable/compress/decompress/bzlib; not
# bzip2.c/bzip2recover.c, which are the CLI tools MULTIARC doesn't need)
# were compiled directly with the zig-cc wrapper and archived with
# zig-ar. Verified: a smoketest linked against the resulting libbz2.a
# passes `onebin audit --profile hybrid --level 1 --strict` with 0
# findings (`needed: libc.so.6` only).
bzip2 1.0.8 ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269 https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz

# xz/liblzma. NOTE FOR WHOEVER TOUCHES THIS LINE NEXT: XZ Utils 5.6.0 and
# 5.6.1 shipped a deliberate supply-chain backdoor (CVE-2024-3094) hidden
# in the release tarballs' build machinery. Never trust a copied hash for
# this dependency — always download and hash it yourself, and cross-check
# against upstream's own doc/SHA256SUMS
# (https://raw.githubusercontent.com/tukaani-project/xz/refs/heads/master/doc/SHA256SUMS)
# before pinning a new version, not just against a single mirror. Done
# for this line: both matched. Built via CMake
# (-DBUILD_SHARED_LIBS=OFF -DXZ_TOOL_XZ=OFF and friends — library only,
# no CLI tools) with onebin-linux-hybrid.cmake. Verified: a smoketest
# linked against the resulting liblzma.a passes `onebin audit --profile
# hybrid --level 1 --strict` with 0 findings (`needed: libc.so.6` only).
xz 5.8.3 3d3a1b973af218114f4f889bbaa2f4c037deaae0c8e815eec381c3d546b974a0 https://github.com/tukaani-project/xz/releases/download/v5.8.3/xz-5.8.3.tar.gz

# libarchive itself — this is what MULTIARC actually links against.
# Verified: configured with -DBUILD_SHARED_LIBS=OFF, CLI tools
# (tar/cpio/cat/unzip) and their own test suite all disabled (MULTIARC
# only needs the library), OpenSSL/mbedTLS/Nettle/LZO/expat/PCRE2POSIX
# disabled (no need for xar/regex features MULTIARC doesn't use, and
# OpenSSL would reopen the GPLv2 licence problem from §7.7 for no
# benefit here), pointed at this file's own zlib/bzip2/xz builds above
# via explicit *_INCLUDE_DIR/*_LIBRARY cache variables rather than a
# global CMAKE_LIBRARY_PATH — same pin-everything-explicitly spirit as
# this file. A smoketest round-tripped tar.gz, tar.bz2, tar.xz and zip
# archives through the resulting libarchive.a (write then read back,
# comparing entry name and content) and passed `onebin audit --profile
# hybrid --level 1 --strict` with 0 findings (`needed: libc.so.6
# libpthread.so.0`).
libarchive 3.8.9 f5a6539059cf5e597dbeda37bfa4874b1e8dea063c8d93bf85a2b44af90a5bd4 https://github.com/libarchive/libarchive/releases/download/v3.8.9/libarchive-3.8.9.tar.gz

# --- graphics (GUI|SDL) --------------------------------------------------
# FreeType: text rasterisation. Verified: configured with
# -DBUILD_SHARED_LIBS=OFF, HarfBuzz/PNG/Brotli/BZip2 support disabled for
# this first pass (HarfBuzz is next in this file and depends on FreeType,
# so FreeType is built once now without it and will be rebuilt with it
# enabled once HarfBuzz itself is pinned and built — the standard way out
# of their circular dependency; PNG/Brotli/BZip2 support are for embedded
# colour bitmaps / WOFF2 / bzip2-compressed PCF fonts respectively, none
# of which far2l-sdl needs), pointed at this file's own zlib build via
# explicit *_INCLUDE_DIR/*_LIBRARY cache variables. A smoketest linked
# against the resulting libfreetype.a loaded a real host font
# (/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf — proving Layer
# 2 works, not just Layer 1 code) and rasterised a glyph, then passed
# `onebin audit --profile hybrid --level 1 --strict` with 0 findings
# (`needed: libc.so.6 libpthread.so.0`).
freetype 2.14.3 e61b31ab26358b946e767ed7eb7f4bb2e507da1cfefeb7a8861ace7fd5c899a1 https://download.savannah.gnu.org/releases/freetype/freetype-2.14.3.tar.gz
