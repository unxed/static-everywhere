# contrib/konsole/kde-sources.lock -- the exact commit of every KDE project
# kde-builder builds for Konsole, except Konsole itself (pinned by tag in
# deps.lock).
#
# Format: <project> <commit> <repository>
#
# Why: the graph used to follow master (branch-group latest-kf6), so an
# upstream commit could break a run that changed nothing here --
# kcoreaddons 864299c6 did exactly that on 2026-09-24. These are the
# commits built by the first green run, 36046810445 (f595739): for each
# project, the master head at the moment kde-builder fetched it, taken
# from that run's log; no later commit on any first-parent history has an
# earlier committer date, so the choice is unambiguous.
#
# kde-builder cannot clone a bare commit -- it checks every pin with
# `git ls-remote`, which sees only refs -- but it checks out `commit:` in
# an existing clone. tools/konsole-source-pins.sh therefore clones what is
# missing before kde-builder runs, renders one `commit:` override per line
# into kde-builder.yaml.in, and verifies after the build that every source
# tree is at its pin. Preflight fails when this file, the template and
# kde-graph.txt disagree.
#
# To move a pin: change the commit here, run
# `tools/konsole-source-pins.sh sync-template`, and let a full run prove it.
