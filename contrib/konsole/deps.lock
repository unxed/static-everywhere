# contrib/konsole/deps.lock — pinned inputs for the Konsole showcase.
# The Qt/KF6 graph is built from source; only the ABI-stable desktop contract
# remains on the host (X11/xcb and OpenGL), exactly as in f4-qt.
# konsole is pinned to a TAG, not a commit sha. kde-builder validates the
# pin with `git ls-remote --exit-code <repo> <ref>`, which sees only ref
# names -- branches and tags -- never a bare commit, so a sha fails with
# "repository has no ref" every time regardless of whether it exists. The
# previous pin, 264ecd08, was also a January-2024 commit against KF6
# frameworks built from 2026 master; the tag below is the release
# matching that era. The commit it resolves to is recorded for
# provenance; kde-builder fetches from invent.kde.org, not the GitHub
# mirror, so that is the URL that matters.
