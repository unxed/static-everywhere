name: f4-qt (zig toolchain, no container)

# Builds f4-qt via tools/build-f4-qt.sh --toolchain zig -- the
# container-free path (05-REFERENCE-f4-qt.md, STATUS.md). Manual trigger
# only: this is a genuinely heavy build (Qt + ~35 Conan packages from
# source), not something to run on every push. GitHub-hosted runners give
# this the one thing a short-lived sandbox session can't: several hours
# of uninterrupted wall-clock time in a single job, which matters because
# Conan does not resume an interrupted package build -- any interruption
# restarts that package's build() from a fresh folder, discarding all
# prior compilation progress (found and documented while trying this in
# a time-boxed sandbox; see STATUS.md).
#
# Caches both the Conan package cache and ccache's storage across runs,
# so a re-run (e.g. after a recipe or toolchain tweak) doesn't repay the
# full ~35-package cost from zero.

on:
  workflow_dispatch:
    inputs:
      f4_pin:
        description: 'f4 commit to build (default: the pin tools/build-f4-qt.sh already carries)'
        required: false
        default: ''

jobs:
  preflight:
    # Gates the two-hour build on checks that take seconds. Several hours
    # of this project's CI have been spent discovering mistakes that were
    # visible in one second of --print-plan output: a step added to the
    # wrong branch of the script, a Conan flag that deleted the sources CI
    # caches, an object passed by a relative path. Those are assertions
    # about the command line the script emits, and asserting them here
    # means a bad patch fails before anything is compiled.
    #
    # --with-scan also checks the source trees for calls to glibc symbols
    # newer than the 2.27 baseline. statx and close_range each cost a full
    # two-hour run to find; they are findable in seconds because the
    # symbol set is enumerable and the sources are on disk.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout static-everywhere
        uses: actions/checkout@v4

      - name: Fetch the trees that still get compiled
        run: |
          git clone --filter=blob:none --quiet https://github.com/Zoinen/f4 f4-src
          PIN=$(grep -m1 '^PIN=' tools/build-f4-qt.sh | sed -E 's/^PIN="([^"]+)"/\1/')
          git -C f4-src checkout --quiet "$PIN"
          git -C f4-src -c 'url.https://github.com/.insteadOf=git@github.com:' \
              submodule update --init --recursive --depth 1
          git clone --depth 1 --quiet --branch main \
              https://github.com/stdware/qwindowkit.git qwk-src

      - name: Install zig
        run: |
          curl -sSL -o zig.tar.xz \
            https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar xf zig.tar.xz
          echo "$PWD/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      - name: Install the four dev packages the link probe needs
        # The probe links against the host's GL/EGL/X11/xcb, and linking
        # needs the unversioned .so symlinks, which live in the -dev
        # packages. The runner image ships only the runtime .so.N, so the
        # probe's first real CI run failed on exactly that -- and usefully:
        # the searched-paths output showed /usr/lib/x86_64-linux-gnu/libGL.so
        # being looked for, which is the wrapper fix working.
        #
        # Four packages, one per library, rather than the build job's full
        # xorg-dev list: this job exists to be fast, and each package here
        # is the one that owns the exact file the probe links against
        # (dpkg -S confirms).
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libgl-dev libegl-dev libx11-dev libxcb1-dev

      - name: Set up Go
        # So the preflight's goffi-hardening check actually runs here
        # rather than skipping. That check builds a real goffi binary and
        # proves -buildmode=pie + -bindnow yield RELRO and BIND_NOW and a
        # clean Profile H audit -- exactly the property that, if it broke,
        # would otherwise only surface two hours into the build job at the
        # final f4 audit. A gate that skips its own most expensive-to-learn
        # check is not a gate. Same version the build job pins.
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Fast invariant checks
        # After the zig install and the dev packages, deliberately: the preflight's last check
        # links against the host's GL/X11/xcb/EGL through the wrappers, and
        # skips itself if zig is absent. A check that silently skips is
        # indistinguishable from one that passes.
        run: ./tools/preflight-f4-qt.sh

      - name: Scan for glibc symbols newer than the baseline
        run: |
          ./tools/glibc-source-scan.py \
            f4-src/qt f4-src/third_party/ZoinGallery qwk-src

  build:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout static-everywhere
        uses: actions/checkout@v4

      - name: Free disk space on the runner
        # A run died at target ~3438/6627 with "No space left on device",
        # so hard the runner could not write its own log and no diagnostic
        # artifact was produced. Not a toolchain bug -- capacity. The df
        # output the collector had already recorded in earlier runs shows
        # why, and shows it was inevitable rather than unlucky:
        #
        #   failed at target  397  ->  101G used,  44G free
        #   failed at target 1863  ->  115G used,  30G free
        #
        # That is ~9.8MB of disk per build target. The 4764 targets
        # remaining after 1863 needed roughly 46GB against 30GB available,
        # so the wall was always going to arrive around target ~4900.
        #
        # GitHub's ubuntu-24.04 image ships several toolchains this job
        # never touches. Removing them is the standard remedy. This step
        # measures each one before deleting it and prints df either side,
        # so the next run reports what each was actually worth instead of
        # leaving us to trust a number off the internet -- if the total
        # freed turns out to be too small, that shows up here rather than
        # forty minutes later.
        run: |
          echo "=== before ==="
          df -h /
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /usr/local/.ghcup /usr/share/swift \
                   /usr/local/share/powershell /usr/local/share/chromium \
                   /usr/local/share/boost /opt/hostedtoolcache/CodeQL; do
            if [ -e "$d" ]; then
              printf '  %-8s %s\n' "$(du -sh "$d" 2>/dev/null | cut -f1)" "$d"
              sudo rm -rf "$d" || true
            fi
          done
          docker image prune -af >/dev/null 2>&1 || true
          echo "=== after ==="
          df -h /

      - name: Install host X11/EGL/OpenGL dev headers
        # The same list quickstart-f4-qt.sh's own preflight check looks
        # for -- these are ordinary, ABI-stable desktop packages this
        # project's own doctrine expects the host to provide, not
        # something it vendors. See STATUS.md for how this list was
        # derived (found by running the build for real, not guessed).
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            xorg-dev libx11-xcb-dev uuid-dev libegl1-mesa-dev libgl1-mesa-dev \
            xkb-data libxcb-util-dev libxcb-util0-dev libxcb-cursor-dev \
            libxcb-dri3-dev libxcb-dri2-0-dev libxcb-present-dev \
            libxcb-composite0-dev libxcb-ewmh-dev libxcb-res0-dev \
            libxcb-glx0-dev libxcb-render0-dev libxcb-render-util0-dev \
            libxcb-xkb-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            ccache

      - name: Build onebin
        run: make -C onebin

      - name: Download zig 0.13.0
        run: |
          curl -LO https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar xf zig-linux-x86_64-0.13.0.tar.xz
          echo "$PWD/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Go
        # The packaged f4 is a Go binary; the plan runs `go test` and
        # `go build` to produce and audit it. The runner's preinstalled Go
        # is whatever the image happens to ship, which is not something to
        # depend on -- pin it. f4's go.mod requires go 1.26.0, so pin that:
        # a lower version would make the toolchain silently download 1.26
        # at build time (GOTOOLCHAIN), which is slow and implicit. The
        # build uses -buildmode=pie with -ldflags=-bindnow so the goffi
        # binary -- dynamic by construction via cgo_import_dynamic -- gets
        # RELRO and BIND_NOW without cgo. check-latest keeps patch releases
        # current.
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Configure ccache
        # See quickstart-f4-qt.sh for why base_dir/sloppiness matter even
        # here: Conan still gives each package's build() call a
        # differently-named folder on every invocation, so ccache needs
        # to be told to see past that to get any benefit at all,
        # including across separate CI runs via the cache step below.
        run: |
          ccache --set-config sloppiness=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines
          ccache --set-config base_dir="$HOME/.conan2/p/b"
          ccache --set-config max_size=5G

      - name: Restore Conan downloads and ccache storage
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.conan2/p
            ~/.cache/ccache
            out/f4-qt/sources-backup
          key: f4-qt-zig-conan-ccache-${{ hashFiles('tools/build-f4-qt.sh') }}
          restore-keys: |
            f4-qt-zig-conan-ccache-

      - name: Mark job start (for diagnostic-log freshness filtering)
        run: touch /tmp/job-start-marker

      - name: Clone f4
        run: |
          PIN="${{ inputs.f4_pin }}"
          if [ -z "$PIN" ]; then
            PIN=$(grep -m1 '^PIN=' tools/build-f4-qt.sh | sed -E 's/^PIN="([^"]+)"/\1/')
          fi
          git clone https://github.com/Zoinen/f4 f4-src
          git -C f4-src checkout "$PIN"

      - name: Build f4-qt (--toolchain zig)
        run: |
          # tee, with pipefail so the pipe can't mask a real failure: the
          # diagnostic collector below parses this file to learn which
          # package failed, straight from Conan's own output, instead of
          # guessing.
          set -o pipefail
          ./tools/build-f4-qt.sh \
            --config linux \
            --toolchain zig \
            --gallery public \
            --src "$PWD/f4-src" \
            --out "$PWD/out/f4-qt" \
            --no-fetch 2>&1 | tee /tmp/build-output.log

      - name: ccache stats and disk usage
        if: always()
        # df belongs here, not only in the diagnostic collector: when the
        # disk fills, the collector is exactly what cannot run. This step
        # is cheap, runs on success and failure alike, and gives every
        # future run a headroom figure to compare against.
        run: |
          ccache -s
          echo "=== df -h / ==="
          df -h /
          echo "=== biggest consumers ==="
          du -sh "$HOME/.conan2" "$HOME/.cache/ccache" 2>/dev/null || true

      # Diagnostic collection/upload deliberately runs *before* the cache
      # save below, not after: raised directly in conversation while
      # watching a real failed run -- the cache save routinely takes
      # 7-20+ minutes (it only grows across runs, nothing prunes it), and
      # there's no reason the far more time-critical diagnostic artifact
      # (needed *right now* to understand what broke) should have to wait
      # behind an operation that's purely about making the *next* run
      # faster. Nothing in either direction depends on the other's
      # ordering -- this is a pure reorder, confirmed by diffing this
      # file's own sorted content before and after: identical, only the
      # step sequence changed.
      - name: Collect diagnostic logs on failure
        # config.log (autotools) and CMakeError.log/CMakeOutput.log
        # (CMake) are where the *real* reason a configure step failed
        # actually lives -- terminal output alone hid it for the
        # elfutils failure this step exists because of ("checking
        # whether the C compiler works... no" with zero diagnostic
        # detail printed). Filtered by mtime against the job-start
        # marker so a restored cache's untouched, unrelated logs from
        # packages built in a *previous* run don't drown out the ones
        # that actually matter from *this* run.
        #
        # Originally only searched ~/.conan2/p/b -- a real, found-by-
        # audit-not-by-failure gap: qwindowkit's own CMake build
        # (ci/build-qwindowkit.sh) and the actual f4-qt-host CMake
        # configure/build (both driven directly by this workflow, not
        # through Conan's package cache at all) would have had zero
        # diagnostic capture if either ever failed, the same way
        # elfutils' real failure was invisible before config.log
        # capture existed at all. f4-src is never cached (cloned fresh
        # every run), so everything in it is inherently this run's own
        # -- the mtime filter there is redundant but harmless, kept for
        # consistency. Also added LastTest.log: --output-on-failure
        # only prints failed tests' output to the terminal, not
        # ctest's own fuller Testing/Temporary/LastTest.log.
        #
        # Also added meson-log.txt (Meson's own build log, typically at
        # <build_dir>/meson-logs/meson-log.txt): xkbcommon builds via
        # Meson, not CMake/Autotools like every other package this whole
        # collection mechanism was originally built around, and a real
        # CI run's diagnostic artifact came back with zero evidence for
        # xkbcommon's own xcb/xkb.h failure specifically *because* this
        # filename wasn't in the search list at all -- found by checking
        # the actual collected zip, not guessed in advance.
        #
        # failure() || cancelled(), not failure() alone: confirmed via
        # GitHub's own community discussion (staff-answered) that a
        # step-condition of failure() alone does NOT run when the job
        # is cancelled by hitting timeout-minutes -- a real, systemic
        # gap found on a second, deeper pass of this same audit: if
        # anything in a ~35-package from-scratch build ever genuinely
        # hangs rather than erroring cleanly, this whole diagnostic
        # pipeline would previously have produced nothing at all,
        # exactly when the wall-clock cost of finding out is highest.
        #
        # Also captures disk space (df -h), memory (free -h), and
        # kernel OOM-kill traces (dmesg) -- a parallel, Qt-scale build
        # with many packages compiling at -j$(nproc) is a genuine,
        # plausible candidate for exhausting a GitHub-hosted runner's
        # disk or RAM, which manifests as a process silently vanishing
        # (SIGKILL) with no compiler error text at all, a different and
        # much harder-to-diagnose failure shape than anything else this
        # pipeline already captures.
        if: failure() || cancelled()
        run: |
          set +e
          OUT=/tmp/diagnostic-logs
          mkdir -p "$OUT"

          # (1) Listings: paths + sizes, no content. Structurally
          #     incapable of "missing" a log from a build system we
          #     haven't met yet -- which is exactly how meson-log.txt got
          #     missed twice while chasing filename allowlists. Object
          #     files excluded because they are the bulk and never
          #     informative as text.
          find "$HOME/.conan2/p/b" -newer /tmp/job-start-marker -type f \
               ! -name '*.o' ! -name '*.obj' ! -name '*.lo' \
               -printf '%10s  %p\n' 2>/dev/null | sort -k2 \
               > "$OUT/00-listing-conan-cache.txt"
          if [ -d f4-src ]; then
            find f4-src -type f ! -name '*.o' ! -name '*.obj' \
                 -printf '%10s  %p\n' 2>/dev/null | sort -k2 \
                 > "$OUT/00-listing-f4-src.txt"
          fi

          # (2) Which package actually failed? Conan states it verbatim
          #     on every failure seen so far ("<pkg>/<ver>: WARN: Build
          #     folder <path>"), so read it rather than guess. The WARN
          #     prefix is load-bearing: Conan also prints a plain
          #     "<pkg>: Build folder <path>" line for every package it
          #     builds successfully, and matching those too collected
          #     all ~30 build trees into a 65MB artifact -- caught on the
          #     first real run of this collector, on a mobile connection. Fallback
          #     to the most recently touched build dirs if that line
          #     isn't present (e.g. a failure outside Conan entirely).
          grep -ohE 'WARN: Build folder /[^[:space:]]+' /tmp/build-output.log 2>/dev/null \
            | sed 's|^WARN: Build folder ||' | sort -u > "$OUT/01-failing-build-folders.txt"
          if [ ! -s "$OUT/01-failing-build-folders.txt" ]; then
            find "$HOME/.conan2/p/b" -maxdepth 3 -type d -name 'build-*' \
                 -newer /tmp/job-start-marker 2>/dev/null | tail -5 \
                 > "$OUT/01-failing-build-folders.txt"
            find f4-src -maxdepth 4 -type d -name 'build*' 2>/dev/null | tail -5 \
                 >> "$OUT/01-failing-build-folders.txt"
          fi

          # (3) From those folders ONLY, take every text file under 2M --
          #     decided by actual content type, not by filename or
          #     extension. config.log, meson-log.txt, CMakeError.log,
          #     CMakeConfigureLog.yaml, .ninja_log, meson's introspection
          #     JSON and any future build system's log all qualify
          #     automatically. Scoping to the failing package's own build
          #     folder is what keeps this small enough to download on a
          #     mobile connection instead of dragging in all ~35
          #     packages' build trees.
          while IFS= read -r d; do
            [ -n "$d" ] && [ -d "$d" ] || continue
            rel=$(printf '%s' "$d" | sed 's|^/||; s|/|_|g')
            #     Role-based exclusions, measured against a real Qt
            #     failure artifact rather than guessed. Qt's build tree
            #     generates ~9600 small text files, and four kinds of
            #     generated bookkeeping account for half the download
            #     while carrying no diagnostic information at all:
            #     SBOM output, installed package-config exports,
            #     per-directory install scripts, and moc/uic autogen
            #     bookkeeping. Excluding them took that artifact from
            #     10.6MB to 5.4MB zipped. These are directory *roles*,
            #     not a filename allowlist -- the distinction that the
            #     three earlier rounds of this got wrong -- and every
            #     excluded file is still listed with its size in
            #     00-listing-*, so nothing becomes invisible: it can be
            #     asked for specifically next time.
            #
            #     Do NOT add '*/CMakeFiles/*' here. That directory holds
            #     CMakeConfigureLog.yaml, which is the single file that
            #     diagnosed both the WrapOpenGL/EGL detection failure and
            #     the statx-vs-renameat2 contrast. Checked: it is 0.39MB
            #     and the rest of CMakeFiles is spread thin, so there is
            #     nothing to win there and a great deal to lose.
            find "$d" -type f -size -2M \
                 ! -path '*/qt_sbom/*' \
                 ! -path '*/lib/cmake/*' \
                 ! -path '*_autogen.dir/*' \
                 ! -name 'cmake_install.cmake' \
                 ! -name '*.o' ! -name '*.obj' ! -name '*.a' ! -name '*.lo' \
                 ! -name '*.so' ! -name '*.so.*' 2>/dev/null > /tmp/candidates.txt
            while IFS= read -r f; do
              case "$(file -b --mime-type "$f" 2>/dev/null)" in
                text/*|application/json|application/xml|inode/x-empty)
                  t="$OUT/02-failing-build-folders/$rel/${f#"$d"/}"
                  mkdir -p "$(dirname "$t")" && cp "$f" "$t"
                  ;;
              esac
            done < /tmp/candidates.txt
          done < "$OUT/01-failing-build-folders.txt"

          # (4) The build output itself, trimmed -- saves hand-copying
          #     terminal output out of the GitHub UI, without shipping
          #     the whole multi-megabyte transcript.
          tail -n 3000 /tmp/build-output.log > "$OUT/03-build-output-tail.txt" 2>/dev/null
          grep -nE 'error:|ERROR|FAILED|fatal error|Traceback|undefined' \
               /tmp/build-output.log 2>/dev/null | tail -n 500 \
               > "$OUT/04-build-output-errors.txt"

          # (4b) The compile commands for the objects the failure names.
          #      A link error names symbols and object files; it does not
          #      name the flags those objects were built with, and twice
          #      now the flags were the answer -- WrapOpenGL/EGL came down
          #      to find_library search paths, and Qt's 26 undefined _74
          #      ICU symbols came down to an include directory missing
          #      from a compile line. build.ninja has every compile line
          #      verbatim but is far too large to ship for a project the
          #      size of Qt, so ship only the statements the failure
          #      itself points at. Derived from the error output, not
          #      guessed -- same principle as reading Conan's own "Build
          #      folder" line instead of guessing filenames. Never allowed
          #      to fail the collector.
          python3 tools/ci-extract-compile-commands.py \
                  /tmp/build-output.log \
                  $(cat "$OUT/01-failing-build-folders.txt" 2>/dev/null) \
                  > "$OUT/04b-compile-commands.txt" 2>&1 || true

          {
            echo "=== df -h ==="
            df -h
            echo "=== free -h ==="
            free -h
            echo "=== dmesg (OOM/kill traces, if any) ==="
            if sudo dmesg > /tmp/dmesg-raw.txt 2>&1; then
              grep -iE 'killed process|out of memory|oom' /tmp/dmesg-raw.txt || echo "(checked -- none found)"
            else
              echo "(could not read dmesg -- see raw attempt output below)"
              cat /tmp/dmesg-raw.txt
            fi
          } > "$OUT/05-system-state.txt"

          # (5) Size report, so an unexpectedly huge artifact is visible
          #     in the job log itself rather than only after downloading.
          du -sh "$OUT" > "$OUT/06-collection-size.txt" 2>&1
          find "$OUT" -type f | wc -l >> "$OUT/06-collection-size.txt"
          echo "=== collected ==="
          cat "$OUT/06-collection-size.txt"
          cat "$OUT/01-failing-build-folders.txt"

      - name: Upload diagnostic logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: f4-qt-zig-build-diagnostic-logs
          path: /tmp/diagnostic-logs
          if-no-files-found: warn
          retention-days: 14

      - name: Save Conan downloads and ccache storage
        # Explicit save step, not the implicit post-step of a combined
        # actions/cache@v4 -- found the hard way that the combined
        # action's automatic save silently did not run on a failed job
        # (no "Post Run actions/cache@v4" anywhere in that job's log at
        # all), discarding every package this run had already built
        # (49 of 55, ICU included) and forcing the next attempt to start
        # completely from zero. if: always() plus a genuinely separate
        # save step is the documented, reliable way to guarantee this
        # actually happens regardless of how the job ends.
        #
        # timeout-minutes: 20 -- a real gap this project's own two prior
        # "audit everything" passes both missed: this save step tars and
        # zstd-compresses the *entire* Conan package cache plus ccache
        # storage, which only grows across every CI run (nothing prunes
        # it), and had no bound at all -- caught directly when it was
        # seen visibly still running 7+ minutes in, a third of the whole
        # job's typical wall-clock cost, with no way to tell whether it
        # was genuinely hung or just slow on a now-large cache. Set to
        # 20, not something tighter like 10: the cache only grows over
        # time, and killing a save that would have genuinely finished in
        # 8-9 minutes would recreate the exact "lost all progress"
        # failure this project already fixed once -- the goal here is
        # catching a true, multi-hour hang, not shaving minutes off a
        # merely-large-but-completing save. A step timeout can't lose
        # diagnostic capability here since this step never produces
        # diagnostics itself (config.log/CMakeError.log collection is
        # separate, later, and gated on failure/cancellation already).
        if: always()
        timeout-minutes: 20
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.conan2/p
            ~/.cache/ccache
            out/f4-qt/sources-backup
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Upload build log and binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f4-qt-zig-build
          path: |
            out/f4-qt/f4
            out/f4-qt/f4-diag
            out/f4-qt/smoke.log
          if-no-files-found: warn
          retention-days: 14
