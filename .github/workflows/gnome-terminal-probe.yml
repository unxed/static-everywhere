name: gnome-terminal (probe, then build)

# Three jobs, each gating the next, cheapest first:
#
#   preflight  -- seconds. Plan shape, the probe's own negative controls, the
#                 repository test suite. No display, no GNOME.
#   probe      -- about a minute. Builds gt-probe against the runner's GTK3/VTE
#                 and runs it under Xvfb with a session bus, strictly. This is
#                 the job that produces the artifact worth reading: the measured
#                 runtime contract of a GNOME Terminal-shaped process.
#   build      -- hours, and opt-in only. tools/build-gnome-terminal.sh is a
#                 plan today (see 06-REFERENCE-gnome-terminal.md), so this job
#                 does not run unless explicitly asked for. A job that always
#                 fails is noise, and noise is how a real failure gets ignored.
#
# The diagnostic collection below is a deliberately smaller relative of the one
# in f4-qt-zig-build.yml, and it is smaller for a measured reason: that
# collector exists because a ~35-package Conan graph hides the real error deep
# in a build tree. Nothing here has a build tree yet. What it keeps from that
# design is the part that generalises -- listings before content, freshness
# filtering against a job-start marker, deciding by MIME type rather than by a
# filename allowlist (the mistake that hid meson-log.txt twice), and running
# collection on cancelled() as well as failure(), because a timeout does not
# trigger failure() alone.

on:
  workflow_dispatch:
    inputs:
      run_build:
        description: 'Also attempt the full GNOME stack build (not implemented yet; will fail)'
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - 'contrib/gnome-terminal/**'
      - 'tools/build-gt-probe.sh'
      - 'tools/test-gt-probe.sh'
      - 'tools/preflight-gnome-terminal.sh'
      - 'tools/build-gnome-terminal.sh'
      - '.github/workflows/gnome-terminal-probe.yml'

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install the dev packages the probe links against
        # Exactly the four that own the files the probe links, one per
        # pkg-config module, plus the two runtime pieces the probe needs to
        # run at all. Not a broad gnome dev metapackage: this job exists to be
        # fast, and a package list nobody can justify line by line is how the
        # f4-qt build job's list grew until it had to be re-derived by running
        # the build for real.
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libvte-2.91-dev libgtk-3-dev libhandy-1-dev uuid-dev \
            gnome-terminal-data xvfb dbus-x11 fonts-dejavu-core

      - name: Build onebin
        run: make -C onebin

      - name: Fast invariant checks
        run: ./tools/preflight-gnome-terminal.sh

      - name: Upload the probe report from preflight
        # The preflight runs gt-probe --strict, so when the contract drifts it
        # is preflight that fails and the probe job never starts. Without this
        # step the report exists on the runner and is thrown away, leaving only
        # what the summariser printed into the log. Cheap insurance for the one
        # case where it matters.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnome-terminal-preflight-report
          path: |
            out/gnome-terminal/gt-probe-report.txt
            out/gnome-terminal/gt-probe-stderr.txt
          if-no-files-found: ignore
          retention-days: 14

  probe:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libvte-2.91-dev libgtk-3-dev libhandy-1-dev uuid-dev \
            gnome-terminal-data xvfb dbus-x11 fonts-dejavu-core mesa-utils

      - name: Mark job start (for diagnostic-log freshness filtering)
        run: touch /tmp/job-start-marker

      - name: Build gt-probe
        run: |
          set -o pipefail
          ./tools/build-gt-probe.sh 2>&1 | tee /tmp/probe-build.log

      - name: Run gt-probe (strict)
        # A session bus AND a display. Both are load-bearing and for different
        # reasons: without the bus the GSettings backend silently becomes the
        # memory backend and the app-id check cannot run at all, and without a
        # display gtk_init_check fails and the probe exits 2. The probe reports
        # which of the two is missing rather than making us guess.
        run: |
          set -o pipefail
          mkdir -p out/gnome-terminal
          dbus-run-session -- xvfb-run -a \
            ./out/gnome-terminal/gt-probe \
              --contract contrib/gnome-terminal/probe/host-contract.txt \
              --report out/gnome-terminal/gt-probe-report.txt \
              --strict 2>&1 | tee /tmp/probe-run.log

      - name: Audit the probe binary
        # The probe is built with the flags a conforming binary needs, so it is
        # also the cheapest available end-to-end proof that those flags produce
        # a Level 1 artifact. Never allowed to fail the job by itself: Profile H
        # legitimately carries host GUI libraries, and the DT_NEEDED findings
        # that follow from that are information, not a regression.
        if: always()
        run: ./tools/audit.sh ./out/gnome-terminal/gt-probe 2.28 || true

      - name: Record the runtime environment the measurement was taken in
        # A contract file is only meaningful next to the machine that produced
        # it. The mesa version in particular decides most of the dlopen delta,
        # and it changes under us without any commit of ours.
        if: always()
        run: |
          {
            echo "=== os ==="; cat /etc/os-release | head -3
            echo "=== libc ==="; ldd --version | head -1
            echo "=== toolkit ==="
            for p in gtk+-3.0 vte-2.91 libhandy-1 glib-2.0 pango cairo harfbuzz gdk-pixbuf-2.0; do
              printf '%-16s %s\n' "$p" "$(pkg-config --modversion $p 2>/dev/null || echo -)"
            done
            echo "=== gl ==="; glxinfo -B 2>/dev/null | head -8 || echo "(no glxinfo)"
          } > out/gnome-terminal/environment.txt
          cat out/gnome-terminal/environment.txt

      - name: Collect diagnostics
        if: failure() || cancelled()
        run: |
          set +e
          OUT=/tmp/diagnostic-logs
          mkdir -p "$OUT"

          # (0) The probe's own report first, so it survives even if a later
          #     step of this collector fails. It is also the only artifact that
          #     is useful on a *passing* run, which is why the upload below is
          #     not the only place it appears.
          cp out/gnome-terminal/gt-probe-report.txt "$OUT/00-gt-probe-report.txt" 2>/dev/null
          cp out/gnome-terminal/environment.txt     "$OUT/00-environment.txt" 2>/dev/null
          cp /tmp/probe-build.log "$OUT/01-probe-build.log" 2>/dev/null
          cp /tmp/probe-run.log   "$OUT/02-probe-run.log" 2>/dev/null

          # (1) Listing before content, and filtered for freshness against the
          #     marker. Structurally incapable of missing a log from a build
          #     system we have not met yet.
          find "$PWD/out" -newer /tmp/job-start-marker -type f \
               -printf '%10s  %p\n' 2>/dev/null | sort -k2 \
               > "$OUT/03-listing-out.txt"

          # (2) Anything else fresh and textual under out/, decided by MIME
          #     type rather than by extension.
          find "$PWD/out" -newer /tmp/job-start-marker -type f -size -2M 2>/dev/null \
            | while IFS= read -r f; do
                case "$(file -b --mime-type "$f" 2>/dev/null)" in
                  text/*|application/json|application/xml)
                    t="$OUT/04-out-tree/${f#"$PWD/out/"}"
                    mkdir -p "$(dirname "$t")" && cp "$f" "$t" ;;
                esac
              done

          # (3) An X or D-Bus failure looks identical to a toolkit failure from
          #     the outside, and the remedies are completely different.
          {
            echo "=== df -h ==="; df -h /
            echo "=== free -h ==="; free -h
            echo "=== DISPLAY/session ==="
            echo "DISPLAY=${DISPLAY:-unset} DBUS=${DBUS_SESSION_BUS_ADDRESS:-unset}"
            echo "=== Xvfb present? ==="; command -v Xvfb || echo "(no Xvfb)"
            echo "=== fonts visible to fontconfig ==="; fc-list 2>/dev/null | wc -l
          } > "$OUT/05-system-state.txt"

          du -sh "$OUT" > "$OUT/06-collection-size.txt" 2>&1
          find "$OUT" -type f | wc -l >> "$OUT/06-collection-size.txt"
          cat "$OUT/06-collection-size.txt"

      - name: Upload diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: gnome-terminal-probe-diagnostic-logs
          path: /tmp/diagnostic-logs
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the probe report
        # if: always(), because the report on a *passing* run is the deliverable:
        # it is the measured host contract, and it is what a later bundled build
        # gets diffed against.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnome-terminal-probe-report
          path: |
            out/gnome-terminal/gt-probe-report.txt
            out/gnome-terminal/environment.txt
            out/gnome-terminal/gt-probe
          if-no-files-found: warn
          retention-days: 14

  build:
    needs: probe
    if: inputs.run_build
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Print the plan
        run: ./tools/build-gnome-terminal.sh --print-plan
      - name: Build GNOME Terminal
        run: ./tools/build-gnome-terminal.sh --src ./gnome-terminal-src
