name: Konsole showcase (hybrid Qt/KF6, zig)

# Manual only: Qt plus the KF6 dependency graph is expensive. The preflight
# job is deliberately separate so a bad command line or missing host package
# fails in seconds rather than after the source graph has compiled for hours.
on:
  workflow_dispatch:
    inputs:
      konsole_ref:
        description: 'Konsole commit (blank = the pinned commit in deps.lock)'
        required: false
        default: ''

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout static-everywhere
        uses: actions/checkout@v4

      - name: Install the host probe packages
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libgl-dev libegl-dev libx11-dev libxcb1-dev libxcb-xkb-dev \
            python3-lxml python3-yaml perl liburi-perl gettext flex bison libmount-dev libcanberra-dev \
            libdbus-1-dev libxml2-dev libxml2-utils libxslt1-dev xsltproc \
            docbook-xml docbook-xsl

      - name: Verify KDE build-time Python modules
        run: ./tools/test-konsole-host-python-modules.sh

      - name: Verify KDE build-time Perl modules
        run: ./tools/test-konsole-host-perl-modules.sh

      - name: Verify KDE DocBook build tools
        run: ./tools/test-konsole-host-docbook-tools.sh

      - name: Install zig 0.13.0
        run: |
          curl -sSL -o zig.tar.xz \
            https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar xf zig.tar.xz
          echo "$PWD/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      - name: Build onebin for local checks
        run: make -C onebin

      - name: Fetch the pinned Konsole source for the glibc scan
        run: |
          # deps.lock: `konsole <tag> <sha> <url>`. The tag is what
          # kde-builder checks out (it resolves pins with ls-remote and
          # cannot see a bare commit); the sha is what the tag resolved to
          # when it was pinned, and is the provenance check here. The URL
          # is invent.kde.org, the same remote kde-builder fetches from --
          # this step used to clone the GitHub mirror and compare HEAD to
          # the ref itself, which held only while the ref was a sha.
          KONSOLE_REF=$(awk '$1 == "konsole" { print $2 }' contrib/konsole/deps.lock)
          KONSOLE_SHA=$(awk '$1 == "konsole" { print $3 }' contrib/konsole/deps.lock)
          KONSOLE_URL=$(awk '$1 == "konsole" { print $4 }' contrib/konsole/deps.lock)
          git clone --filter=blob:none --quiet "$KONSOLE_URL" konsole-src
          git -C konsole-src fetch --quiet --depth 1 origin "$KONSOLE_REF"
          git -C konsole-src checkout --quiet "$KONSOLE_REF"
          actual=$(git -C konsole-src rev-parse HEAD)
          if [ "$actual" != "$KONSOLE_SHA" ]; then
            echo "konsole $KONSOLE_REF resolved to $actual, but deps.lock records $KONSOLE_SHA" >&2
            echo "The tag moved, or the lock is stale. Re-pin deliberately." >&2
            exit 1
          fi

      - name: Run kde-builder itself in pretend mode on the rendered config
        # The one check that would have caught most of the config-level
        # failures in seconds rather than after Qt built: run the real
        # kde-builder, at the pinned revision, on the real rendered config,
        # and let it parse the options, type-check them, resolve the
        # dependency graph from KDE's metadata, and validate every pin --
        # exactly as the build job will, minus the building. A grep-based
        # preflight can only assert what it was taught to look for; this
        # asserts what kde-builder actually accepts.
        run: |
          set -euo pipefail
          KDE_BUILDER_REF=$(awk '$1 == "kde-builder" { print $2 }' contrib/konsole/deps.lock)
          git clone --filter=blob:none --quiet https://invent.kde.org/sdk/kde-builder.git kde-builder-src
          git -C kde-builder-src fetch --quiet --depth 1 origin "$KDE_BUILDER_REF"
          git -C kde-builder-src checkout --quiet "$KDE_BUILDER_REF"
          pip install --quiet setproctitle pyyaml
          tools/preflight-konsole-kde-builder-pretend.sh "$PWD/kde-builder-src"

      - name: Fast Konsole invariant checks
        run: ./tools/preflight-konsole.sh

      - name: Scan Konsole sources for newer glibc symbols
        run: ./tools/glibc-source-scan.py konsole-src

  build:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout static-everywhere
        uses: actions/checkout@v4

      - name: Free disk space on the runner
        run: |
          echo '=== before ==='
          df -h /
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /usr/local/.ghcup /usr/share/swift \
                   /usr/local/share/powershell /usr/local/share/chromium \
                   /usr/local/share/boost /opt/hostedtoolcache/CodeQL; do
            if [ -e "$d" ]; then
              printf '  %-8s %s\n' "$(du -sh "$d" 2>/dev/null | cut -f1)" "$d"
              sudo rm -rf "$d" || true
            fi
          done
          docker image prune -af >/dev/null 2>&1 || true
          echo '=== after ==='
          df -h /

      - name: Install host X11/EGL/OpenGL development headers
        run: |
          sudo apt-get update
          # -dev packages are the host header contract, read from
          # contrib/konsole/host-dev-packages.txt -- the same file the build
          # stages headers from, so apt and the stage cannot drift apart.
          sudo apt-get install --no-install-recommends -y \
            $(grep -vE '^\s*(#|$)' contrib/konsole/host-dev-packages.txt | tr '\n' ' ') \
            bison ccache docbook-xml docbook-xsl flex gettext imagemagick liburi-perl libxml2-utils perl python3-dbus python3-lxml python3-setproctitle python3-yaml x11-apps x11-utils xdotool xkb-data xsltproc xvfb

      - name: Verify KDE build-time Python modules
        run: ./tools/test-konsole-host-python-modules.sh

      - name: Verify KDE build-time Perl modules
        run: ./tools/test-konsole-host-perl-modules.sh

      - name: Verify KDE DocBook build tools
        run: ./tools/test-konsole-host-docbook-tools.sh

      - name: Build onebin
        run: make -C onebin

      - name: Download zig 0.13.0
        run: |
          curl -LO https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar xf zig-linux-x86_64-0.13.0.tar.xz
          echo "$PWD/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure ccache
        run: |
          ccache --set-config sloppiness=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines
          ccache --set-config base_dir="$HOME/.conan2/p/b"
          ccache --set-config max_size=5G

      - name: Restore Conan downloads, KDE metadata and ccache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.conan2/p
            ~/.cache/ccache
            out/konsole/sources-backup
            out/konsole/kde-source
            out/konsole/kde-state
          key: konsole-zig-ccache-${{ hashFiles('tools/build-konsole.sh', 'contrib/konsole/**', 'onebin/toolchain/**') }}
          restore-keys: |
            konsole-zig-ccache-

      - name: Fetch pinned kde-builder
        run: |
          KDE_BUILDER_REF=$(awk '$1 == "kde-builder" { print $2 }' contrib/konsole/deps.lock)
          git clone --filter=blob:none --quiet https://invent.kde.org/sdk/kde-builder.git kde-builder-src
          git -C kde-builder-src fetch --quiet --depth 1 origin "$KDE_BUILDER_REF"
          git -C kde-builder-src checkout --quiet "$KDE_BUILDER_REF"
          test "$(git -C kde-builder-src rev-parse HEAD)" = "$KDE_BUILDER_REF"

      - name: Mark the start of this build for diagnostics
        run: touch /tmp/job-start-marker

      - name: Build Qt and KF6, then Konsole
        run: |
          set -o pipefail
          KONSOLE_REF='${{ inputs.konsole_ref }}'
          if [ -z "$KONSOLE_REF" ]; then
            KONSOLE_REF=$(awk '$1 == "konsole" { print $2 }' contrib/konsole/deps.lock)
          fi
          ./tools/build-konsole.sh \
            --out out/konsole \
            --kde-builder "$PWD/kde-builder-src" \
            --konsole-ref "$KONSOLE_REF" \
            --kde-builder-ref "$(awk '$1 == "kde-builder" { print $2 }' contrib/konsole/deps.lock)" \
            2>&1 | tee /tmp/build-output.log

      - name: Run the graphical X11 smoke test
        run: |
          mkdir -p out/konsole/xdg-runtime
          chmod 700 out/konsole/xdg-runtime
          export XDG_RUNTIME_DIR="$PWD/out/konsole/xdg-runtime"
          export KONSOLE_INSTALL_DIR="$PWD/out/konsole/kde-install"
          ./tools/run-konsole-smoke.sh \
            "$PWD/out/konsole/kde-install/bin/konsole" \
            "$PWD/out/konsole/smoke"

      - name: ccache statistics and disk usage
        if: always()
        run: |
          ccache -s || true
          echo '=== df -h / ==='
          df -h /
          echo '=== largest build stores ==='
          du -sh "$HOME/.conan2" "$HOME/.cache/ccache" out/konsole 2>/dev/null || true

      - name: Collect diagnostic logs on failure or cancellation
        if: failure() || cancelled()
        run: |
          set +e
          diag=/tmp/konsole-diagnostic-logs
          mkdir -p "$diag"
          cp out/konsole/konsole-audit.txt "$diag/00-konsole-audit.txt" 2>/dev/null || true
          find "$HOME/.conan2/p/b" -newer /tmp/job-start-marker -type f \
            ! -name '*.o' ! -name '*.a' ! -name '*.so' ! -name '*.so.*' \
            -printf '%10s  %p\n' 2>/dev/null | sort -k2 >"$diag/01-conan-listing.txt"
          grep -ohE 'WARN: Build folder /[^[:space:]]+' /tmp/build-output.log 2>/dev/null \
            | sed 's|^WARN: Build folder ||' | sort -u >"$diag/02-failing-build-folders.txt"
          if [ ! -s "$diag/02-failing-build-folders.txt" ]; then
            find "$HOME/.conan2/p/b" out/konsole/kde-build -maxdepth 4 \
              -type d -name 'build-*' -newer /tmp/job-start-marker \
              2>/dev/null | tail -10 >"$diag/02-failing-build-folders.txt"
          fi
          find "$HOME/.conan2/p/b" out/konsole -type f \
            -newer /tmp/job-start-marker ! -name '*.o' ! -name '*.a' \
            ! -name '*.so' ! -name '*.so.*' -printf '%10s  %p\n' \
            2>/dev/null | sort -k2 >"$diag/03-output-files.txt"
          find "$HOME/.conan2/p/b" out/konsole -type f \
            \( -name config.log -o -name CMakeError.log -o -name CMakeConfigureLog.yaml \
               -o -name meson-log.txt -o -name LastTest.log \) \
            -size -2M -exec cp --parents {} "$diag" \; 2>/dev/null || true
          # The failing modules first, by name, before anything else.
          #
          # kde-builder prints "<<< PROJECTS FAILED TO BUILD >>>" followed
          # by each module and the path to its log. Those are the files a
          # reader opens first, so they are copied first and unconditionally
          # -- no size test, no ordering luck, no ceiling reached before
          # them. Everything else in this step is context around them.
          mkdir -p "$diag/04-text"
          sed -n '/PROJECTS FAILED TO BUILD/,/^$/p' /tmp/build-output.log \
            2>/dev/null \
            | grep -oE '/[^ ]*/kde-logs/[^ ]*' \
            | while IFS= read -r failed_log; do
                failed_dir=$(dirname "$failed_log")
                [ -d "$failed_dir" ] || continue
                # The failing module's compile_commands.json, too. ninja does
                # not echo compile lines, so a link error whose cause is the
                # include ORDER of a compile -- konsole's ubidi_*_74 against
                # Conan's ICU 78 -- cannot be diagnosed from logs alone. Three
                # hypotheses about that order were each refuted locally; the
                # fourth needs the actual command, so it travels with the logs.
                failed_module=$(basename "$failed_dir")
                cc_json="out/konsole/kde-build/$failed_module/compile_commands.json"
                if [ -f "$cc_json" ]; then
                  mkdir -p "$diag/04-text/$(dirname "$cc_json")"
                  cp "$cc_json" "$diag/04-text/$cc_json" 2>/dev/null || true
                fi
                for one in "$failed_dir"/*; do
                  [ -f "$one" ] || continue
                  target="$diag/04-text/${one#/}"
                  mkdir -p "$(dirname "$target")"
                  cp "$one" "$target" 2>/dev/null || true
                done
              done

          # Collect what diagnoses a build, not every text file in it.
          #
          # "any text file under 2 MB, minus a few exclusions" produced a
          # 429 MB artifact: 412 MB of it was kde-build, and its bulk was
          # .ts translation catalogues, DocBook, generated .cpp and ninja
          # .d files. None of that has ever answered a question here.
          #
          # An allowlist instead, of the files someone actually opens: what
          # configure decided, what it decided with, and what the build and
          # the KDE builder said.
          # build.log is allowed up to 8 MB: with ninja -v every compile
          # command is in it, and the largest modules approach the old 2 MB
          # cap -- which would have dropped exactly the logs -v exists for.
          # Everything else keeps the 2 MB per-file cap; the 32 MB total
          # ceiling below still bounds the artifact.
          find "$HOME/.conan2/p/b" out/konsole/kde-build out/konsole/kde-logs \
            -type f -newer /tmp/job-start-marker \
            \( -size -2M -o \( -name 'build.log' -size -8M \) \) \
            ! -path '*/qt_sbom/*' ! -path '*/lib/cmake/*' \
            ! -path '*_autogen.dir/*' \
            \( -name '*.log' -o -name 'config.h' -o -name 'CMakeCache.txt' \
               -o -name 'CMakeConfigureLog.yaml' -o -name 'meson-log.txt' \
               -o -name 'config.log' -o -name 'moc_predefs.h' \
               -o -name '*Config.cmake' \
               -o -name 'CMakeCXXCompiler.cmake' -o -name 'CMakeCCompiler.cmake' \
               -o -name 'build.ninja' -o -name '.ninja_log' \
               -o -name 'conan_toolchain.cmake' -o -name '*-data.cmake' \
               -o -name 'CMakePresets.json' -o -name 'compile_commands.json' \) \
            2>/dev/null > /tmp/konsole-text-candidates
          # A ceiling independent of the allowlist above. The allowlist is
          # a judgement about which files matter and could be wrong again;
          # 32 MB is arithmetic and cannot be.
          copied_kb=0
          # No mime-type gate. The allowlist above already names the files
          # by what they are; asking file(1) as well only adds a second
          # opinion that can disagree. It did: kio's cmake.log was in the
          # listing at 30 KB, its sibling git-*.log files were copied, and
          # it was not -- so the failing module's configure log, the one
          # file needed to diagnose the run, was the one dropped. A build
          # log full of ANSI escapes is still a build log.
          while IFS= read -r candidate; do
            case "keep" in
              keep)
                candidate_kb=$(du -k "$candidate" 2>/dev/null | cut -f1)
                candidate_kb=${candidate_kb:-0}
                if [ "$((copied_kb + candidate_kb))" -gt 32768 ]; then
                  printf 'Collection stopped at 32 MB; see 06-build-errors.txt,\n' \
                    >"$diag/04-text/TRUNCATED.txt"
                  printf 'which is extracted from the whole build log.\n' \
                    >>"$diag/04-text/TRUNCATED.txt"
                  break
                fi
                target="$diag/04-text/${candidate#/}"
                mkdir -p "$(dirname "$target")"
                cp "$candidate" "$target"
                copied_kb=$((copied_kb + candidate_kb))
                ;;
            esac
          done < /tmp/konsole-text-candidates
          tail -n 3000 /tmp/build-output.log >"$diag/05-build-output-tail.txt" 2>/dev/null
          grep -nE 'error:|ERROR|FAILED|fatal error|Traceback|undefined' \
            /tmp/build-output.log 2>/dev/null | tail -n 500 >"$diag/06-build-errors.txt"
          {
            echo '=== df -h ==='; df -h
            echo '=== free -h ==='; free -h
            echo '=== dmesg OOM traces ==='
            sudo dmesg 2>/dev/null | grep -iE 'killed process|out of memory|oom' || true
          } >"$diag/07-system-state.txt"
          du -sh "$diag" >"$diag/08-collection-size.txt" 2>&1

      - name: Upload diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: konsole-zig-build-diagnostic-logs
          path: /tmp/konsole-diagnostic-logs
          if-no-files-found: warn
          retention-days: 14

      - name: Save Conan downloads, KDE metadata and ccache
        if: always()
        timeout-minutes: 20
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.conan2/p
            ~/.cache/ccache
            out/konsole/sources-backup
            out/konsole/kde-source
            out/konsole/kde-state
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Upload Konsole and graphical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: konsole-zig-build
          path: |
            out/konsole/kde-install/bin/konsole
            out/konsole/kde-install/bin/konsole.audit.txt
            out/konsole/konsole-audit.txt
            out/konsole/konsole-onebin-audit.txt
            out/konsole/smoke
            out/konsole/smoke/render.log
          if-no-files-found: warn
          retention-days: 14
