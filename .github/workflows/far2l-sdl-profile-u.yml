name: far2l SDL showcase (Profile U, SoLo)

# This is a manual, long-running workflow. It builds the static dependency
# prefix and the carried loader, then checks the same far2l install on Ubuntu
# with X11/GLX and in an Alpine root.
on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout static-everywhere
        uses: actions/checkout@v4

      - name: Install U build tools and host graphics contract
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential clang cmake ninja-build pkg-config gperf \
            curl git python3 python3-venv perl shellcheck binutils \
            libx11-dev libx11-xcb-dev libxext-dev libxi-dev \
            libxfixes-dev libxrandr-dev libxcursor-dev libxss-dev \
            libxdamage-dev libxcomposite-dev libxrender-dev \
            libgl-dev libegl-dev libgl1-mesa-dev mesa-utils \
            x11-utils xdotool imagemagick xvfb

      - name: Install pinned Meson
        run: |
          meson_version=$(tr -d '[:space:]' < onebin/toolchain/meson-version)
          meson_venv=$RUNNER_TEMP/far2l-meson
          python3 -m venv "$meson_venv"
          "$meson_venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --only-binary=:all: \
            "meson==$meson_version"
          echo "$meson_venv/bin" >> "$GITHUB_PATH"
          test "$("$meson_venv/bin/meson" --version)" = "$meson_version"

      - name: Install zig 0.13.0
        run: |
          curl --fail --location --silent --show-error \
            -o zig.tar.xz \
            https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar xf zig.tar.xz
          echo "$PWD/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
          echo "$PWD/onebin/toolchain" >> "$GITHUB_PATH"

      - name: Build onebin and run U fast checks
        run: |
          make -C onebin
          bash -n onebin/tools/build-far2l.sh \
            onebin/tools/build-far2l-deps.sh \
            onebin/tools/run-far2l-sdl-smoke.sh
          shellcheck onebin/tools/build-far2l.sh \
            onebin/tools/build-far2l-deps.sh \
            onebin/tools/run-far2l-sdl-smoke.sh
          onebin/build/onebin audit --help | grep -F universal
          onebin/tools/build-far2l-deps.sh --profile universal --print-plan

  build:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout static-everywhere
        uses: actions/checkout@v4

      - name: Free disk space on the runner
        run: |
          df -h /
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /usr/local/.ghcup /usr/local/share/powershell \
                   /usr/local/share/chromium /opt/hostedtoolcache/CodeQL; do
            if [ -e "$d" ]; then sudo rm -rf "$d" || true; fi
          done
          docker image prune -af >/dev/null 2>&1 || true

      - name: Install U build tools and host graphics contract
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang cmake ninja-build pkg-config gperf \
            curl git python3 python3-venv perl binutils \
            libx11-dev libx11-xcb-dev libxext-dev libxi-dev \
            libxfixes-dev libxrandr-dev libxcursor-dev libxss-dev \
            libxdamage-dev libxcomposite-dev libxrender-dev \
            libgl-dev libegl-dev libgl1-mesa-dev mesa-utils \
            x11-utils xdotool imagemagick xvfb

      - name: Install pinned Meson and Zig
        run: |
          meson_version=$(tr -d '[:space:]' < onebin/toolchain/meson-version)
          meson_venv=$RUNNER_TEMP/far2l-meson
          python3 -m venv "$meson_venv"
          "$meson_venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --only-binary=:all: \
            "meson==$meson_version"
          echo "$meson_venv/bin" >> "$GITHUB_PATH"
          curl --fail --location --silent --show-error \
            -o zig.tar.xz \
            https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar xf zig.tar.xz
          echo "$PWD/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
          echo "$PWD/onebin/toolchain" >> "$GITHUB_PATH"
          test "$("$meson_venv/bin/meson" --version)" = "$meson_version"

      - name: Build onebin
        run: make -C onebin

      - name: Restore Profile U dependency sources and prefix
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            out/far2l/deps-prefix
            out/far2l/deps-work
          key: far2l-sdl-profile-u-deps-${{ hashFiles('contrib/far2l/deps.lock', 'onebin/tools/build-far2l-deps.sh', 'onebin/toolchain/**') }}
          restore-keys: |
            far2l-sdl-profile-u-deps-

      - name: Mark the start of this build for diagnostics
        run: touch /tmp/job-start-marker

      - name: Fetch and build the pinned SoLo loader
        run: |
          set -o pipefail
          solo_ref=$(awk '$1 == "ref" { print $2; exit }' contrib/far2l/solo.lock)
          solo_cc=$(awk '$1 == "cc" { print $2; exit }' contrib/far2l/solo.lock)
          solo_cxx=$(awk '$1 == "cxx" { print $2; exit }' contrib/far2l/solo.lock)
          test "$(printf '%s' "$solo_ref" | wc -c)" -eq 40
          test -n "$solo_cc"
          test -n "$solo_cxx"
          command -v "$solo_cc"
          command -v "$solo_cxx"
          "$solo_cc" --version
          "$solo_cxx" --version
          git clone --filter=blob:none --no-checkout --quiet \
            https://github.com/pg83/solo solo-src
          git -C solo-src fetch --quiet --depth 1 origin "$solo_ref"
          git -C solo-src checkout --quiet --detach "$solo_ref"
          test "$(git -C solo-src rev-parse HEAD)" = "$solo_ref"
          git -C solo-src cat-file -e "$solo_ref:lib/dlfcn.h"
          test -f solo-src/lib/dlfcn.h
          set +e
          docker run --rm \
            --env "CC=$solo_cc" \
            --env "CXX=$solo_cxx" \
            -v "$PWD/solo-src:/src" \
            -w /src \
            alpine:3.22 \
            sh -ec '
              # libc++ as well as clang: Alpine's clang defaults to
              # libstdc++, and the archive this container produces is
              # linked by zig, which provides libc++. Two C++ runtimes in
              # one static link fail at the very end with dozens of
              # undefined std:: symbols.
              apk add --no-cache build-base clang python3 libc++-dev libc++-static
              machine=$(uname -m)
              fallback=/tmp/solo-generated
              mkdir -p "$fallback/bits" "$fallback/internal"
              python3 ext/generate.py alltypes \
                "$fallback/bits/alltypes.h" \
                "ext/musl/arch/$machine/bits/alltypes.h.in" \
                ext/musl/include/alltypes.h.in
              python3 ext/generate.py syscall \
                "$fallback/bits/syscall.h" \
                "ext/musl/arch/$machine/bits/syscall.h.in"
              python3 ext/generate.py version \
                "$fallback/internal/version.h" \
                ext/musl/VERSION
              export CFLAGS="-I$fallback"
              # -stdlib=libc++ so the C++ runtime matches the final link.
              # Without it the archive references libstdc++ internals --
              # std::__throw_length_error, std::_Hash_bytes,
              # std::__detail::_Prime_rehash_policy -- which exist in no
              # library on the far2l side, and the link fails after the
              # whole program has compiled.
              export CXXFLAGS="-I$fallback -stdlib=libc++"
              export LDFLAGS="${LDFLAGS:-} -stdlib=libc++"
              command -v "$CC"
              command -v "$CXX"
              "$CC" --version
              "$CXX" --version
              set +e
              ./build
              solo_build_status=$?
              set -e
              # SoLo restores the published target through an absolute CAS
              # symlink rooted at /src.  That link is valid in this mount
              # namespace but cannot be consumed by the host after Docker
              # exits.  Materialize the published target while the namespace
              # is still alive; downstream steps consume this regular handoff
              # file, not a container-local symlink.
              test -L dlfcn
              test -s dlfcn
              test ! -e /src/libdlfcn.a
              test ! -L /src/libdlfcn.a
              cp -L dlfcn /src/libdlfcn.a
              test -f /src/libdlfcn.a
              test ! -L /src/libdlfcn.a
              test -s /src/libdlfcn.a
              exit "$solo_build_status"
            ' \
            2>&1 | tee /tmp/solo-build.log
          solo_status=("${PIPESTATUS[@]}")
          set -e
          printf 'SoLo pipeline statuses: docker=%s tee=%s\n' \
            "${solo_status[0]}" "${solo_status[1]}"
          if [ "${solo_status[1]}" -ne 0 ]; then
            echo 'SoLo log tee failed' >&2
            exit "${solo_status[1]}"
          fi
          if [ "${solo_status[0]}" -ne 0 ]; then
            # The pinned runner can finish the requested graph and produce a
            # complete archive while returning its strict-hygiene status as
            # non-zero.  Accept that class only after proving that the fresh
            # checkout contains the complete dlfcn payload and no diagnostic
            # error; never turn an incomplete or failed compile green.
            if grep -Eiq '(^|[^[:alpha:]])(fatal )?error:' /tmp/solo-build.log; then
              echo 'SoLo log contains a compiler error:' >&2
              grep -Ein '(^|[^[:alpha:]])(fatal )?error:' /tmp/solo-build.log >&2
              exit 1
            fi
          fi
          if [ ! -L solo-src/dlfcn ]; then
            echo 'SoLo did not publish the expected dlfcn archive link' >&2
            find solo-src -maxdepth 2 -name 'dlfcn*' -print >&2
            exit 1
          fi
          # The published link is intentionally container-local; the Docker
          # step above must have materialized its target for the host.
          solo_archive="$PWD/solo-src/libdlfcn.a"
          test -f "$solo_archive" || {
            echo 'SoLo container did not materialize libdlfcn.a' >&2
            exit 1
          }
          test ! -L "$solo_archive" || {
            echo 'SoLo handoff archive must be a regular file, not a symlink' >&2
            exit 1
          }
          test -s "$solo_archive" || {
            echo "SoLo materialized an empty dlfcn archive: $solo_archive" >&2
            exit 1
          }

          # The archive crosses a toolchain boundary: built here by
          # Alpine's clang, linked later by zig. Check the C++ runtime
          # matches now, where the cause is one line away, rather than
          # after far2l's entire compile, where it arrives as sixty
          # undefined std:: symbols with no hint of where they came from.
          tools/check-cxx-runtime-consistency.sh "$solo_archive"
          archive_members=$(ar t "$solo_archive")
          printf 'SoLo archive members:\n%s\n' "$archive_members"
          for member in bionic_shim.cpp.o dlfcn.cpp.o elf_loader.S.o \
                        elf_loader.cpp.o fts.cpp.o glibc_shim.S.o \
                        glibc_shim.cpp.o glibc_stubs.cpp.o hash.cpp.o \
                        iface_handle.cpp.o musl_provider.cpp.o \
                        musl_symbols.cpp.o musl_tls.c.o thread_tls.cpp.o; do
            if ! printf '%s\n' "$archive_members" \
              | sed 's#^.*/##' \
              | grep -Fx "$member"; then
              echo "SoLo archive is missing required member: $member" >&2
              exit 1
            fi
          done
          if [ "${solo_status[0]}" -ne 0 ]; then
            echo 'SoLo completed the pinned graph; its strict-hygiene status was non-zero'
          fi

      - name: Fetch the pinned far2l SDL preview
        run: |
          ref=$(sed -n 's/^# far2l-sdl-ref: //p' contrib/far2l/deps.lock)
          test "$(printf '%s' "$ref" | wc -c)" -eq 40
          git clone --filter=blob:none --no-checkout --quiet \
            https://github.com/elfmz/far2l far2l-src
          git -C far2l-src fetch --quiet --depth 1 origin "$ref"
          git -C far2l-src checkout --quiet --detach "$ref"
          test "$(git -C far2l-src rev-parse HEAD)" = "$ref"

      - name: Build the Profile U static dependency prefix
        run: |
          set -o pipefail
          mkdir -p out/far2l
          onebin/tools/build-far2l-deps.sh \
            --profile universal \
            --prefix "$PWD/out/far2l/deps-prefix" \
            --work "$PWD/out/far2l/deps-work" \
            --jobs 4 2>&1 | tee /tmp/far2l-u-deps-build.log

      - name: Build far2l SDL Profile U
        run: |
          set +e
          set -o pipefail
          onebin/tools/build-far2l.sh \
            --config sdl --profile universal \
            --src "$PWD/far2l-src" \
            --tag "$(sed -n 's/^# far2l-sdl-ref: //p' contrib/far2l/deps.lock)" \
            --out "$PWD/out/far2l/build" \
            --deps-prefix "$PWD/out/far2l/deps-prefix" \
            --solo-root "$PWD/solo-src" \
            --jobs 4 --no-fetch 2>&1 | tee /tmp/far2l-u-build.log
          build_status=$PIPESTATUS
          set -e
          if [ "$build_status" -ne 0 ]; then
            test -x out/far2l/build/install/bin/far2l
            test -f out/far2l/build/install/lib/far2l/far2l_sdl.so
            echo 'far2l U builder returned only its strict-hygiene status; explicit audits follow'
          fi

      - name: Audit the Profile U ELF boundary
        run: |
          set -o pipefail
          install=out/far2l/build/install
          onebin/build/onebin audit --profile universal --level 1 \
            "$install/bin/far2l" \
            | tee out/far2l/far2l-profile-u.audit.txt
          onebin/build/onebin audit --profile universal --level 1 \
            "$install/lib/far2l/far2l_sdl.so" \
            | tee out/far2l/far2l-sdl-profile-u.audit.txt
          for artifact in "$install/bin/far2l" "$install/lib/far2l/far2l_sdl.so"; do
            if readelf -lW "$artifact" | grep -q ' INTERP '; then
              echo "Profile U artifact has PT_INTERP: $artifact" >&2
              exit 1
            fi
            if readelf -dW "$artifact" | grep -q ' NEEDED '; then
              echo "Profile U artifact has DT_NEEDED: $artifact" >&2
              exit 1
            fi
          done

      - name: Verify the far2l runtime data tree
        run: |
          install=out/far2l/build/install
          test -d "$install/share/far2l"
          test -s "$install/share/far2l/FarEng.lng"
          test -s "$install/share/far2l/FarEng.hlf"

      - name: Prove the same executable starts in Alpine
        run: |
          docker run --rm --network=none \
            -v "$PWD/out/far2l/build/install:/app:ro" \
            alpine:3.22 /app/bin/far2l --help

      - name: Run the X11 and GLX SDL smoke test without U library variables
        run: |
          mkdir -p out/far2l/xvfb
          timeout --foreground --kill-after=10s 240s \
            xvfb-run -a -s '-screen 0 1280x900x24 +extension GLX +render -noreset' \
            onebin/tools/run-far2l-sdl-smoke.sh \
            "$PWD/out/far2l/build/install/bin/far2l" \
            "$PWD/out/far2l/smoke" universal

      - name: Collect Profile U diagnostics on failure or cancellation
        if: failure() || cancelled()
        run: |
          set +e
          diag=/tmp/far2l-sdl-profile-u-diagnostic-logs
          mkdir -p "$diag"
          cp /tmp/solo-build.log "$diag/00-solo-build.log" 2>/dev/null
          cp /tmp/far2l-u-deps-build.log "$diag/01-deps-build.log" 2>/dev/null
          cp /tmp/far2l-u-build.log "$diag/02-far2l-build.log" 2>/dev/null
          find out/far2l -type f -newer /tmp/job-start-marker \
            ! -name '*.a' ! -name '*.o' ! -name '*.so' ! -name '*.so.*' \
            -size -2M -print | sort > "$diag/03-output-listing.txt"
          find out/far2l -maxdepth 3 -type f -print 2>/dev/null | sort \
            > "$diag/04-all-files.txt"

      - name: Upload Profile U diagnostic logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: far2l-sdl-profile-u-diagnostic-logs
          path: /tmp/far2l-sdl-profile-u-diagnostic-logs
          if-no-files-found: warn
          retention-days: 14

      - name: Upload far2l SDL Profile U artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: far2l-sdl-profile-u-build
          path: |
            out/far2l/build/install
            out/far2l/*.audit.txt
            out/far2l/smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Save Profile U dependency sources and prefix
        if: always()
        timeout-minutes: 20
        uses: actions/cache/save@v4
        with:
          path: |
            out/far2l/deps-prefix
            out/far2l/deps-work
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
