name: gnome-terminal-hybrid-static-gtk

on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install recipe-check tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            binutils cmake curl git make ninja-build pkg-config python3-venv \
            libx11-dev libxcb1-dev libxau-dev libxdmcp-dev

      - name: Install pinned Meson
        run: |
          meson_version=$(tr -d '[:space:]' < onebin/toolchain/meson-version)
          meson_venv="$RUNNER_TEMP/gnome-terminal-meson"
          python3 -m venv "$meson_venv"
          "$meson_venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --only-binary=:all: \
            "meson==${meson_version}" \
            packaging==24.1
          echo "$meson_venv/bin" >> "$GITHUB_PATH"
          test "$("$meson_venv/bin/meson" --version)" = "$meson_version"

      - name: Install zig 0.13.0
        run: |
          curl --fail --location --silent --show-error \
            -o "$RUNNER_TEMP/zig.tar.xz" \
            https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
          echo "$PWD/onebin/toolchain" >> "$GITHUB_PATH"

      - name: Test onebin
        run: make -sC onebin test

      - name: Check the static GTK recipe
        run: ./tools/preflight-gnome-terminal.sh

  build:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout static-everywhere
        uses: actions/checkout@v4

      - name: Install build tools and the host display contract
        # Only X11/OpenGL/EGL runtime libraries and desktop data are supplied
        # by the runner. GTK, GLib, Pango, Cairo, GdkPixbuf, VTE and libhandy
        # come from deps.lock; D-Bus is used through static GLib. The pinned
        # GNOME Terminal source additionally needs host build metadata/tools:
        # gsettings-desktop-schemas.pc and itstool are not part of the GTK
        # code closure.
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config gperf gawk gettext xsltproc \
            autoconf automake libtool libltdl-dev curl git python3 python3-venv perl \
            binutils ccache xvfb x11-utils xdotool imagemagick \
            libx11-dev libx11-xcb-dev libxext-dev libxi-dev libxrandr-dev libxrender-dev \
            libxcursor-dev libxdamage-dev libxfixes-dev libxcomposite-dev \
            libgl-dev libegl-dev libgl1-mesa-dev libegl1-mesa-dev mesa-utils \
            gsettings-desktop-schemas gsettings-desktop-schemas-dev itstool

      - name: Verify source-audited GNOME Terminal build inputs
        # GNOME Terminal 3.52.0's pinned meson.build requires the schemas
        # pkg-config metadata, while data/meson.build unconditionally uses
        # i18n.itstool_join even when documentation is disabled.
        run: |
          set -euo pipefail
          for tool in itstool xsltproc; do
            command -v "$tool"
          done
          pkg-config --atleast-version=0.1.0 gsettings-desktop-schemas

      - name: Free disk space on the runner
        run: |
          echo '=== before ==='
          df -h /
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /usr/local/.ghcup /usr/share/swift \
                   /usr/local/share/powershell /usr/local/share/chromium \
                   /usr/local/share/boost /opt/hostedtoolcache/CodeQL; do
            if [ -e "$d" ]; then
              printf '  %-8s %s\n' "$(du -sh "$d" 2>/dev/null | cut -f1)" "$d"
              sudo rm -rf "$d" || true
            fi
          done
          docker image prune -af >/dev/null 2>&1 || true
          echo '=== after ==='
          df -h /

      - name: Install pinned Meson
        run: |
          meson_version=$(tr -d '[:space:]' < onebin/toolchain/meson-version)
          meson_venv="$RUNNER_TEMP/gnome-terminal-meson"
          python3 -m venv "$meson_venv"
          "$meson_venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --only-binary=:all: \
            "meson==${meson_version}" \
            packaging==24.1
          echo "$meson_venv/bin" >> "$GITHUB_PATH"
          test "$("$meson_venv/bin/meson" --version)" = "$meson_version"

      - name: Install zig 0.13.0
        run: |
          curl --fail --location --silent --show-error \
            -o "$RUNNER_TEMP/zig.tar.xz" \
            https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
          echo "$PWD/onebin/toolchain" >> "$GITHUB_PATH"

      - name: Build onebin toolchain
        run: make -C onebin

      - name: Configure ccache
        run: |
          ccache --set-config max_size=5G
          ccache --set-config compression=true

      - name: Restore GNOME Terminal dependency prefix and ccache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            out/gnome-terminal/static-prefix
            out/gnome-terminal/deps-work/sources
            ~/.cache/ccache
          key: gnome-terminal-gtk-${{ hashFiles('contrib/gnome-terminal/deps.lock', 'tools/build-gnome-terminal-deps.sh', 'tools/build-gnome-terminal.sh', 'tools/pkg-config-hybrid-host.sh', 'tools/verify-gnome-terminal-static.sh', 'contrib/gnome-terminal/**', 'onebin/toolchain/**') }}
          restore-keys: |
            gnome-terminal-gtk-

      - name: Mark the start of this build for diagnostics
        run: touch /tmp/job-start-marker

      - name: Build the pinned static GTK dependency prefix
        run: |
          set -o pipefail
          mkdir -p out/gnome-terminal
          export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/zig-global-cache"
          export ZIG_LOCAL_CACHE_DIR="$RUNNER_TEMP/zig-local-cache"
          tools/build-gnome-terminal-deps.sh \
            --prefix "$PWD/out/gnome-terminal/static-prefix" \
            --work "$PWD/out/gnome-terminal/deps-work" \
            --jobs 4 2>&1 | tee "$RUNNER_TEMP/gnome-terminal-deps-build.log"

      - name: Fetch the pinned GNOME Terminal source
        run: |
          ref=$(awk '$1 == "gnome-terminal" { print $3; exit }' contrib/gnome-terminal/deps.lock)
          url=$(awk '$1 == "gnome-terminal" { print $4; exit }' contrib/gnome-terminal/deps.lock)
          test "${#ref}" -eq 40
          printf '%s\n' "$ref" | grep -Eq '^[0-9a-f]{40}$'
          git clone --filter=blob:none --no-checkout --quiet "$url" gnome-terminal-src
          git -C gnome-terminal-src fetch --quiet --depth 1 origin "$ref"
          git -C gnome-terminal-src checkout --quiet --detach "$ref"
          test "$(git -C gnome-terminal-src rev-parse HEAD)" = "$ref"

      - name: Build and verify GNOME Terminal
        run: |
          set -o pipefail
          export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/zig-global-cache"
          export ZIG_LOCAL_CACHE_DIR="$RUNNER_TEMP/zig-local-cache"
          tools/build-gnome-terminal.sh \
            --src "$PWD/gnome-terminal-src" \
            --deps-prefix "$PWD/out/gnome-terminal/static-prefix" \
            --out "$PWD/out/gnome-terminal" \
            --jobs 4 2>&1 | tee "$RUNNER_TEMP/gnome-terminal-build.log"

      - name: Smoke-test the installed GNOME Terminal on X11 and OpenGL
        run: |
          set -euo pipefail
          package="$PWD/out/gnome-terminal/package"
          test -x "$package/usr/bin/gnome-terminal"
          test -x "$package/usr/libexec/gnome-terminal-server"
          # The package is configured for the real /usr runtime prefix. Install
          # it into this disposable runner before testing D-Bus activation;
          # launching from DESTDIR with PATH/data overrides tests a different
          # layout and cannot resolve the service's /usr/libexec executable.
          sudo cp -a "$package/usr/." /usr/
          hash -r
          unset XDG_DATA_DIRS GSETTINGS_SCHEMA_DIR GTK_PATH GTK_MODULES
          test "$(command -v gnome-terminal)" = /usr/bin/gnome-terminal
          test -x /usr/libexec/gnome-terminal-server
          test -f /usr/share/dbus-1/services/org.gnome.Terminal.service
          xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" \
            dbus-run-session -- \
            gnome-terminal --wait -- bash -c 'exit 0'
          xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" glxinfo -B

      - name: ccache statistics and disk usage
        if: always()
        run: |
          ccache -s || true
          echo '=== df -h / ==='
          df -h /
          echo '=== GNOME Terminal stores ==='
          du -sh out/gnome-terminal "$HOME/.cache/ccache" 2>/dev/null || true

      - name: Collect diagnostics on failure or cancellation
        if: failure() || cancelled()
        run: |
          set +e
          diag=/tmp/gnome-terminal-diagnostic-logs
          mkdir -p "$diag"
          # Copy the logs whole, but not without limit.
          #
          # A build whose third-party headers warn on every macro
          # expansion produced a 180 MB artifact that could not be
          # downloaded at all -- the error was in there, and unreachable.
          # An artifact nobody can open is worth less than a truncated
          # one that says it was truncated.
          #
          # Above the cap, keep the head and the tail: the head carries
          # the configure summary and the first failure, the tail carries
          # the last. The error extract below is unaffected either way,
          # because it greps the original log, not this copy.
          copy_log() {  # $1 = source, $2 = destination
            local src=$1 dst=$2 lines
            [ -f "$src" ] || return 0
            lines=$(wc -l <"$src")
            if [ "$lines" -le 200000 ]; then
              cp "$src" "$dst"
              return 0
            fi
            {
              printf '=== TRUNCATED: %s lines, keeping the first and last 50000 ===\n' \
                "$lines"
              printf '=== The full log was too large to attach. If the failure is\n'
              printf '=== not visible here, look at 06-errors-*.txt, which is\n'
              printf '=== extracted from the whole log rather than from this copy.\n\n'
              head -n 50000 "$src"
              printf '\n=== ... %s lines omitted ...\n\n' "$((lines - 100000))"
              tail -n 50000 "$src"
            } >"$dst"
          }
          copy_log "$RUNNER_TEMP/gnome-terminal-deps-build.log" "$diag/00-deps-build.log"
          copy_log "$RUNNER_TEMP/gnome-terminal-build.log" "$diag/01-gnome-terminal-build.log"

          # Point at the failure inside those logs.
          #
          # Copying them whole fixed the truncation that lost the vte
          # error, but a six-figure line count still has to be searched.
          # The konsole workflow has extracted errors for a while and its
          # failures read in one step; this does the same, with context,
          # because "error: X" without the command above it and the note
          # below it is usually not enough either.
          for log_name in 00-deps-build 01-gnome-terminal-build; do
            src="$diag/${log_name}.log"
            [ -f "$src" ] || continue
            grep -nE -B 5 -A 15 \
              'error:|FAILED|fatal error|Traceback|undefined reference|ninja: build stopped' \
              "$src" 2>/dev/null | tail -n 800 \
              > "$diag/06-errors-${log_name}.txt" || true
            if [ ! -s "$diag/06-errors-${log_name}.txt" ]; then
              printf 'Nothing matched the failure patterns in %s.\n' \
                "${log_name}.log" > "$diag/06-errors-${log_name}.txt"
              printf 'If the build failed, widen the patterns in the\n' \
                >> "$diag/06-errors-${log_name}.txt"
              printf 'workflow -- do not read this as a clean log.\n' \
                >> "$diag/06-errors-${log_name}.txt"
            fi
          done
          # Collect the files that diagnose a build, not every file that
          # is not a binary.
          #
          # The previous filter was "newer than the job start, not .a/.o/
          # .so, under 2 MB" -- and everything under out/gnome-terminal is
          # newer than the job start, because the job creates it. That
          # included the full source checkouts of glib, gtk, cairo, pango,
          # harfbuzz, freetype, fontconfig, vte and gnome-terminal: every
          # .c, .h, .ui, .po and test fixture. 178 MB of artifact in which
          # the logs were a rounding error, too large to download at all.
          #
          # An allowlist instead. Each entry answers a question someone
          # actually asks when a build fails: what did configure decide
          # (meson-log, config.log, CMakeCache), what did it decide it
          # with (config.h), and what did the build itself say (*.log).
          find out/gnome-terminal -type f -newer /tmp/job-start-marker \
            \( -name 'meson-log.txt' -o -name 'config.log' \
               -o -name 'config.h' -o -name 'CMakeCache.txt' \
               -o -name 'CMakeConfigureLog.yaml' -o -name '*.log' \
               -o -name 'meson-info.json' \) \
            -size -2M -print | sort > "$diag/02-output-listing.txt"
          # A hard ceiling on the collection, independent of the
          # allowlist above. The allowlist is a judgement about which
          # files matter and could be wrong again; this is arithmetic and
          # cannot be. Stop at 32 MB and say so in the artifact.
          copied_kb=0
          while IFS= read -r file; do
            file_kb=$(du -k "$file" 2>/dev/null | cut -f1)
            file_kb=${file_kb:-0}
            if [ "$((copied_kb + file_kb))" -gt 32768 ]; then
              printf 'Collection stopped at 32 MB. Remaining files listed\n' \
                >"$diag/03-text/TRUNCATED.txt"
              printf 'in 02-output-listing.txt were not copied.\n' \
                >>"$diag/03-text/TRUNCATED.txt"
              break
            fi
            rel=${file#out/gnome-terminal/}
            target="$diag/03-text/$rel"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target" 2>/dev/null || true
            copied_kb=$((copied_kb + file_kb))
          done < "$diag/02-output-listing.txt"
          # No tails here: 00-deps-build.log and 01-gnome-terminal-build.log
          # above are the same two logs, whole. A merge left both forms in
          # this step for a while, which doubled the artifact and invited
          # a reader to open the truncated copy of a log that was already
          # present in full.

          # Extract the failures, do not just tail.
          #
          # A tail is not a diagnosis. The vte build failed while
          # reflect.c was emitting 2806 warnings, so all 3000 tailed
          # lines were warnings and the error itself -- from a parallel
          # ninja job that had finished earlier -- was outside the
          # window. grep -c error on the whole artifact returned 0. The
          # konsole workflow has extracted errors for a while and its
          # failures have been diagnosable in one step; this brings the
          # two collectors level.
          #
          # -B/-A give the surrounding lines, because "error: X" without
          # the command above it and the note below it usually is not
          # enough either.
          for log_name in gnome-terminal-build gnome-terminal-deps-build; do
            src="$RUNNER_TEMP/${log_name}.log"
            [ -f "$src" ] || continue
            grep -nE -B 5 -A 15 \
              'error:|ERROR|FAILED|fatal error|Traceback|undefined reference|ninja: build stopped' \
              "$src" 2>/dev/null | tail -n 800 \
              > "$diag/06-errors-${log_name}.txt" || true
          done

          # If the build failed and nothing was extracted, say so in the
          # artifact rather than leaving a reader to conclude the logs
          # are fine. Silence here means the patterns above missed the
          # failure and need widening -- that is itself the finding.
          for f in "$diag"/06-errors-*.txt; do
            [ -e "$f" ] || continue
            if [ ! -s "$f" ]; then
              printf 'No line matched the failure patterns in this log.\n' \
                > "$f"
              printf 'If the build failed, the patterns in the workflow\n' \
                >> "$f"
              printf 'need widening -- do not conclude the log is clean.\n' \
                >> "$f"
            fi
          done
          {
            echo '=== df -h ==='; df -h
            echo '=== free -h ==='; free -h
            echo '=== dmesg OOM traces ==='
            sudo dmesg 2>/dev/null | grep -iE 'killed process|out of memory|oom' || true
          } > "$diag/06-system-state.txt"
          du -sh "$diag" > "$diag/07-collection-size.txt" 2>&1 || true

      - name: Save GNOME Terminal dependency prefix and ccache
        if: always()
        timeout-minutes: 20
        uses: actions/cache/save@v4
        with:
          path: |
            out/gnome-terminal/static-prefix
            out/gnome-terminal/deps-work/sources
            ~/.cache/ccache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Upload GNOME Terminal artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnome-terminal-hybrid-static-gtk
          path: |
            out/gnome-terminal/package
            out/gnome-terminal/gnome-terminal-server
            out/gnome-terminal/gnome-terminal-onebin-audit.txt
            out/gnome-terminal/*.audit.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: gnome-terminal-hybrid-static-gtk-diagnostics
          path: /tmp/gnome-terminal-diagnostic-logs
          if-no-files-found: warn
          retention-days: 14
